name: OPEN-21 Fixture
start_room: halle

rooms:
  - id: halle
    name: Halle
    desc: Eine Halle.
    exits:
      north: kammer
  - id: kammer
    name: Kammer
    desc: Eine Kammer.
    exits:
      south: halle

items:
  - id: kerze
    name: Kerze
    keys: [kerze]
    desc: Eine Kerze.
    location: halle
    verb_map:
      "put out": [{msg: Die Kerze erlischt.}]
      "fill,tool:wasser": [{msg: Du fuellst die Kerze mit Wasser.}]
      # bewusster Tippfehler: 'fehl' ist keine Item-/NPC-Id → UnknownVerbTool-Warnung
      "fill,tool:fehl": [{msg: Du fuellst die Kerze mit Feenstaub.}]
      "fill": [{msg: Du fuellst die Kerze.}]
  - id: leck
    name: Leck
    keys: [leck]
    desc: Ein Leck in der Wand.
    location: halle
    verb_map:
      "put on": [{msg: Das Leck ist abgedichtet.}]
  - id: wasser
    name: Wasser
    keys: [wasser]
    desc: Wasser.
    location: halle

verbs:
  - name: put out
    aliases: [blow out]
  - name: put on
    patterns: ["put <x> on <y>"]
  - name: fill
    pattern: "fill <x> with <y>"
  - name: turn off
    patterns: ["turn off <x>", "turn <x> off"]
