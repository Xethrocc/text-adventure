# Die Monster-Insel — Ein Pokémon-lite Adventure
#
# Genre: Monster sammeln / Safari-Park
# Benchmark: C4 (Combat-Slots, Switch-Verb, Per-Monster-XP)
# Feature-Mapping (laut /root/workspace/plan-monster-sammeln.md):
#   - Fangen: ability mit Ball-Pflicht (has_item: safariball) + random:-Wurf
#   - Team: combat_slot:, switch_verb: (C4), party.<id>.slot, party.slot.active
#   - Per-Monster-XP: xp_table: (C4, Validierungscodes PartyInvalidXpTable/PartyNonMonotonicXp)
#   - Typ-Effektivitaet: §9.1-Rezept (Typ-Variable je NPC, cmd.target-Zielaufloesung,
#     mult-Regeltabelle O(T^2), compute_var fuer Schaden)
#   - Begegnungen: encounter_tables: (7c) mit Zonen-Gates
#   - Arena-Liga: 4 Trainer (Jan, Lea, Bruno, Pyra) + Champion Viktor
#   - 4 Typen: feuer, wasser, blatt, stein
#   - ASCII/TUI-Showcase:
#       - title_art / end_art (text2ascii)
#       - Pro Monster eigenes ASCII-Art (Art-Mechanik wie in soul_collector.yaml)
#       - Animierte frames: fuer Fang-Sequence und Level-Up
#       - ambient:-Loop in der Arena
#       - Minimap map: mit Koordinaten und 2 Ebenen (floor: 0 / 1)
#   - Sieg: Liga gewonnen + Dex-Mindestzahl gefangen
#   - Fail: Turnier-Aus / ohne Team angetreten

name: Die Monster-Insel
start_room: park_zentrale
language: de

combat:
  profile: classic
  screen:
    bar_width: 20
    scene: ">> KAMPF IN DER MONSTER-ARENA <<"

player:
  max_hp: 50
  attack: 8
  defense: 3

title_art: |
  #   #  ###  #   #  #### ##### ##### ####      ### #   #  #### ##### #    
  ## ## #   # ##  # #       #   #     #   #      #  ##  # #     #     #    
  # # # #   # # # #  ###    #   ####  ####  ###  #  # # #  ###  ####  #    
  #   # #   # #  ##     #   #   #     #  #       #  #  ##     # #     #    
  #   #  ###  #   # ####    #   ##### #   #     ### #   # ####  ##### #####
  =========================================================================
                 D I E   M O N S T E R - I N S E L
              --- Das Pokémon-lite Safari-Adventure ---
  =========================================================================

end_art:
  victory: |
    =========================================================================
     #### #   #  ###  #   # ####  ###  ###  #   #
    #     #   # #   # ## ## #   #  #  #   # ##  #
    #     ##### ##### # # # ####   #  #   # # # #
    #     #   # #   # #   # #      #  #   # #  ##
     #### #   # #   # #   # #     ###  ###  #   #
    =========================================================================
    VICTORY — Der Meistertitel gehoert dir!
    Du hast die Insel-Liga gewonnen und deinen Ranger-Dex gefuellt!
    Alle Trainer verbeugen sich vor deiner meisterhaften Bindung
    zu deinen Monstern. Du bist die lebende Legende der Monster-Insel!
  turnier_aus: |
    =========================================================================
    ##### #   # ####  #   # ### ##### ####       ###  #   #  ####
      #   #   # #   # ##  #  #  #     #   #     #   # #   # #    
      #   #   # ####  # # #  #  ####  ####  ### ##### #   #  ### 
