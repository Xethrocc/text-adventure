rules:
  # Moves als Direktkommandos (§9.1)
  - id: cmd_glutstoss
    on: command glutstoss
    effects:
      - { set_var: { name: move_type, value: 1 } }
      - { msg: "Glutstoss: Lodernde Feuerfunken zischen auf das Ziel!" }

  - id: cmd_aquawelle
    on: command aquawelle
    effects:
      - { set_var: { name: move_type, value: 2 } }
      - { msg: "Aquawelle: Ein reissender Wasserstrahl schlaegt ein!" }

  - id: cmd_blatttanz
    on: command blatttanz
    effects:
      - { set_var: { name: move_type, value: 3 } }
      - { msg: "Blatttanz: Scharfe Pflanzendornen peitschen hervor!" }

  - id: cmd_steinwurf
    on: command steinwurf
    effects:
      - { set_var: { name: move_type, value: 4 } }
      - { msg: "Steinwurf: Ein wuchtiger Felsbrocken donnert auf das Ziel!" }

  # Fang-Mechanik
  - id: cmd_fangen_fallback
    on: command fangen
    when: { not: { has_item: safariball } }
    effects: [{ msg: "Du hast keinen Safari-Ball mehr im Rucksack! Hole Nachschub aus der Zentrale." }]

  - id: cmd_fangen_with_ball
    on: command fangen
    when: { has_item: safariball }
    effects:
      - { set_var: { name: fang_versuch, value: 1 } }

  - id: catch_nassling
    on: turn
    when: { all: [{ compare_var: { name: fang_versuch, op: gte, value: 1 } }, { var: cmd.target, is: nassling }, { at: player, room: strand_lagune }, { compare_var: { name: party.nassling, op: eq, value: 0 } }] }
    effects:
      - { play_clip: clip_fang }
      - { msg: "KLICK! Nassling wurde gefangen!" }
      - { set_var: { var: "party.nassling", val: 1 } }
      - { add_var: { var: dex_count, delta: 1 } }
      - { set_var: { name: fang_versuch, value: 0 } }
      - { msg: "Nassling schliesst sich deinem Team an!" }

  - id: catch_blattfink
    on: turn
    when: { all: [{ compare_var: { name: fang_versuch, op: gte, value: 1 } }, { var: cmd.target, is: blattfink }, { at: player, room: dschungel_dickicht }, { compare_var: { name: party.blattfink, op: eq, value: 0 } }] }
    effects:
      - { play_clip: clip_fang }
      - { msg: "KLICK! Blattfink wurde gefangen!" }
      - { set_var: { var: "party.blattfink", val: 1 } }
      - { add_var: { var: dex_count, delta: 1 } }
      - { set_var: { name: fang_versuch, value: 0 } }
      - { msg: "Blattfink schliesst sich deinem Team an!" }

  - id: catch_glutling
    on: turn
    when: { all: [{ compare_var: { name: fang_versuch, op: gte, value: 1 } }, { var: cmd.target, is: glutling }, { at: player, room: vulkan_krater }, { compare_var: { name: party.glutling, op: eq, value: 0 } }] }
    effects:
      - { play_clip: clip_fang }
      - { msg: "KLICK! Glutling wurde gefangen!" }
      - { set_var: { var: "party.glutling", val: 1 } }
      - { add_var: { var: dex_count, delta: 1 } }
      - { set_var: { name: fang_versuch, value: 0 } }
      - { msg: "Glutling schliesst sich deinem Team an!" }

  - id: catch_felsling
    on: turn
    when: { all: [{ compare_var: { name: fang_versuch, op: gte, value: 1 } }, { var: cmd.target, is: felsling }, { at: player, room: hoehle_tiefe }, { compare_var: { name: party.felsling, op: eq, value: 0 } }] }
    effects:
      - { play_clip: clip_fang }
      - { msg: "KLICK! Felsling wurde gefangen!" }
      - { set_var: { var: "party.felsling", val: 1 } }
      - { add_var: { var: dex_count, delta: 1 } }
      - { set_var: { name: fang_versuch, value: 0 } }
      - { msg: "Felsling schliesst sich deinem Team an!" }

  - id: catch_arena_refuse
    on: turn
    when:
      all:
        - compare_var: { name: fang_versuch, op: gte, value: 1 }
        - any:
            - { var: cmd.target, is: flossler }
            - { var: cmd.target, is: borkenkauz }
            - { var: cmd.target, is: gargol }
            - { var: cmd.target, is: flamara }
            - { var: cmd.target, is: krateron }
    effects:
      - { msg: "Das Monster gehoert einem Arenatrainer! Du kannst fremde Monster nicht fangen!" }
      - { set_var: { name: fang_versuch, value: 0 } }

  # Kein passendes wildes Monster hier (oder schon im Team): Wurf verpufft
  - id: catch_miss
    on: turn
    when: { compare_var: { name: fang_versuch, op: gte, value: 1 } }
    effects:
      - { msg: "Der Safari-Ball rollt ins Leere — hier ist kein wildes Monster dieser Art (mehr) zu fangen." }
      - { set_var: { name: fang_versuch, value: 0 } }

  # §9.1 Typ-Effektivitaet: Zielaufloesung ueber cmd.target
  - id: target_is_glutling
    on: turn
    when: { all: [{ var: cmd.target, is: glutling }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 1 } }]

  - id: target_is_flamara
    on: turn
    when: { all: [{ var: cmd.target, is: flamara }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 1 } }]

  - id: target_is_krateron
    on: turn
    when: { all: [{ var: cmd.target, is: krateron }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 1 } }]

  - id: target_is_nassling
    on: turn
    when: { all: [{ var: cmd.target, is: nassling }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 2 } }]

  - id: target_is_flossler
    on: turn
    when: { all: [{ var: cmd.target, is: flossler }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 2 } }]

  - id: target_is_blattfink
    on: turn
    when: { all: [{ var: cmd.target, is: blattfink }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 3 } }]

  - id: target_is_borkenkauz
    on: turn
    when: { all: [{ var: cmd.target, is: borkenkauz }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 3 } }]

  - id: target_is_felsling
    on: turn
    when: { all: [{ var: cmd.target, is: felsling }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 4 } }]

  - id: target_is_gargol
    on: turn
    when: { all: [{ var: cmd.target, is: gargol }, { compare_var: { name: move_type, op: gte, value: 1 } }] }
    effects: [{ set_var: { name: target_type, value: 4 } }]

  # §9.1 Typ-Tabelle: Sehr effektive Paarungen (mult = 2)
  - id: chart_fire_vs_leaf
    on: turn
    when: { all: [{ compare_var: { name: move_type, op: eq, value: 1 } }, { compare_var: { name: target_type, op: eq, value: 3 } }] }
    effects: [{ set_var: { name: mult, value: 2 } }]

  - id: chart_water_vs_fire
    on: turn
    when: { all: [{ compare_var: { name: move_type, op: eq, value: 2 } }, { compare_var: { name: target_type, op: eq, value: 1 } }] }
    effects: [{ set_var: { name: mult, value: 2 } }]

  - id: chart_water_vs_stone
    on: turn
    when: { all: [{ compare_var: { name: move_type, op: eq, value: 2 } }, { compare_var: { name: target_type, op: eq, value: 4 } }] }
    effects: [{ set_var: { name: mult, value: 2 } }]

  - id: chart_leaf_vs_water
    on: turn
    when: { all: [{ compare_var: { name: move_type, op: eq, value: 3 } }, { compare_var: { name: target_type, op: eq, value: 2 } }] }
    effects: [{ set_var: { name: mult, value: 2 } }]

  - id: chart_leaf_vs_stone
    on: turn
    when: { all: [{ compare_var: { name: move_type, op: eq, value: 3 } }, { compare_var: { name: target_type, op: eq, value: 4 } }] }
    effects: [{ set_var: { name: mult, value: 2 } }]

  - id: chart_stone_vs_fire
    on: turn
    when: { all: [{ compare_var: { name: move_type, op: eq, value: 4 } }, { compare_var: { name: target_type, op: eq, value: 1 } }] }
    effects: [{ set_var: { name: mult, value: 2 } }]

  # Schadensberechnung & Meldung
  - id: resolve_move_effect
    on: turn
    when: { compare_var: { name: move_type, op: gte, value: 1 } }
    effects:
      - { compute_var: { var: eff_damage, expr: "base_damage * mult" } }
      - if: { compare_var: { name: mult, op: gte, value: 2 } }
        then:
          - { msg: "Das ist sehr effektiv! ({mult}x Multiplikator, {eff_damage} Effektivschaden!)" }
        else:
          - { msg: "Treffer erzielt! ({mult}x Multiplikator, {eff_damage} Schaden.)" }
      - { set_var: { name: move_type, value: 0 } }
      - { set_var: { name: target_type, value: 0 } }
      - { set_var: { name: mult, value: 1 } }

  # Schadenstransfer auf Gegner
  - id: dmg_flossler
    on: turn
    when: { all: [{ var: cmd.target, is: flossler }, { compare_var: { name: eff_damage, op: gte, value: 1 } }, { at: player, room: arena_stadion }, { at: flossler, room: arena_stadion }] }
    effects: [{ damage_npc: { npc: flossler, amount: 20 } }, { set_var: { name: eff_damage, value: 0 } }]

  - id: dmg_borkenkauz
    on: turn
    when: { all: [{ var: cmd.target, is: borkenkauz }, { compare_var: { name: eff_damage, op: gte, value: 1 } }, { at: player, room: arena_stadion }, { at: borkenkauz, room: arena_stadion }] }
    effects: [{ damage_npc: { npc: borkenkauz, amount: 25 } }, { set_var: { name: eff_damage, value: 0 } }]

  - id: dmg_gargol
    on: turn
    when: { all: [{ var: cmd.target, is: gargol }, { compare_var: { name: eff_damage, op: gte, value: 1 } }, { at: player, room: arena_stadion }, { at: gargol, room: arena_stadion }] }
    effects: [{ damage_npc: { npc: gargol, amount: 30 } }, { set_var: { name: eff_damage, value: 0 } }]

  - id: dmg_flamara
    on: turn
    when: { all: [{ var: cmd.target, is: flamara }, { compare_var: { name: eff_damage, op: gte, value: 1 } }, { at: player, room: arena_stadion }, { at: flamara, room: arena_stadion }] }
    effects: [{ damage_npc: { npc: flamara, amount: 35 } }, { set_var: { name: eff_damage, value: 0 } }]

  - id: dmg_krateron
    on: turn
    when: { all: [{ var: cmd.target, is: krateron }, { compare_var: { name: eff_damage, op: gte, value: 1 } }, { at: player, room: arena_stadion }, { at: krateron, room: arena_stadion }] }
    effects: [{ damage_npc: { npc: krateron, amount: 45 } }, { set_var: { name: eff_damage, value: 0 } }]

  # Move ohne gueltiges Arena-Ziel: Restschaden verfaellt
  - id: dmg_verfallen
    on: turn
    when: { compare_var: { name: eff_damage, op: gte, value: 1 } }
    effects: [{ set_var: { name: eff_damage, value: 0 } }]

  # Arena-Liga: Fail-Gates & Kaempfe
  - id: fail_gate_empty_party
    on: command herausfordern
    when: { compare_var: { name: dex_count, op: eq, value: 0 } }
    effects:
      - { msg: "TURNIER-AUS — Ohne Monster im Team kannst du nicht antreten! Du wirst disqualifiziert." }
      - { msg: "Du scheidest aus der Arena-Liga aus." }
      - { game_end: turnier_aus }

  - id: fail_cmd_aufgeben
    on: command aufgeben
    when: { at: player, room: arena_stadion }
    effects:
      - { msg: "TURNIER-AUS — Du gibst das Match auf und deine Monster treten den Rueckzug an!" }
      - { msg: "Du scheidest aus der Arena-Liga aus." }
      - { game_end: turnier_aus }

  # Arena-Monster sind nur nach offizieller Herausforderung im Ring angreifbar
  - id: wartesaal_kein_kampf
    on: before attack
    when: { at: player, room: arena_wartesaal }
    effects:
      - { block: "Der Liga-Schiedsrichter pfeift energisch: 'Gekaempft wird nur im Ring — und erst nach offizieller Herausforderung!'" }

  # Trainer 1: Jan
  - id: challenge_jan
    on: command herausfordern
    when: { all: [{ at: player, room: arena_stadion }, { compare_var: { name: dex_count, op: gte, value: 1 } }, { not: { has_flag: jan_besiegt } }] }
    effects:
      - { msg: "Trainer Jan ruft Flossler in die Arena!" }
      - { move_npc: flossler, to: arena_stadion }

  - id: defeat_jan
    on: state flossler
    when: { at: flossler, room: arena_stadion }
    once: true
    effects:
      - { set_flag: jan_besiegt }
      - { msg: "Flossler ist kampfunfaehig! Trainer Jan ruft es zurueck: 'Du hast echtes Talent! Lea wartet schon auf dich!'" }
      - { add_var: { var: "party.glutling.xp", delta: 60 } }
      - { add_var: { var: "party.nassling.xp", delta: 60 } }
      - { add_var: { var: "party.blattfink.xp", delta: 60 } }
      - { add_var: { var: "party.felsling.xp", delta: 60 } }
      - { msg: "Dein Team erhaelt 60 Erfahrungspunkte!" }

  # Trainer 2: Lea
  - id: challenge_lea
    on: command herausfordern
    when: { all: [{ at: player, room: arena_stadion }, { has_flag: jan_besiegt }, { not: { has_flag: lea_besiegt } }] }
    effects:
      - { msg: "Trainerin Lea ruft Borkenkauz in die Arena!" }
      - { move_npc: borkenkauz, to: arena_stadion }

  - id: defeat_lea
    on: state borkenkauz
    when: { at: borkenkauz, room: arena_stadion }
    once: true
    effects:
      - { set_flag: lea_besiegt }
      - { msg: "Borkenkauz sinkt erschoepft zu Boden. Trainerin Lea nickt: 'Beeindruckend! Jetzt musst du an Bruno vorbei!'" }
      - { add_var: { var: "party.glutling.xp", delta: 60 } }
      - { add_var: { var: "party.nassling.xp", delta: 60 } }
      - { add_var: { var: "party.blattfink.xp", delta: 60 } }
      - { add_var: { var: "party.felsling.xp", delta: 60 } }
      - { msg: "Dein Team erhaelt 60 Erfahrungspunkte!" }

  # Trainer 3: Bruno
  - id: challenge_bruno
    on: command herausfordern
    when: { all: [{ at: player, room: arena_stadion }, { has_flag: lea_besiegt }, { not: { has_flag: bruno_besiegt } }] }
    effects:
      - { msg: "Trainer Bruno ruft Gargol in die Arena!" }
      - { move_npc: gargol, to: arena_stadion }

  - id: defeat_bruno
    on: state gargol
    when: { at: gargol, room: arena_stadion }
    once: true
    effects:
      - { set_flag: bruno_besiegt }
      - { msg: "Gargol splittert und geht k.o.! Bruno lacht droehnend: 'Stark gekaempft! Doch Pyras Feuer wird dich testen!'" }
      - { add_var: { var: "party.glutling.xp", delta: 60 } }
      - { add_var: { var: "party.nassling.xp", delta: 60 } }
      - { add_var: { var: "party.blattfink.xp", delta: 60 } }
      - { add_var: { var: "party.felsling.xp", delta: 60 } }
      - { msg: "Dein Team erhaelt 60 Erfahrungspunkte!" }

  # Trainer 4: Pyra
  - id: challenge_pyra
    on: command herausfordern
    when: { all: [{ at: player, room: arena_stadion }, { has_flag: bruno_besiegt }, { not: { has_flag: pyra_besiegt } }] }
    effects:
      - { msg: "Trainerin Pyra ruft Flamara in die Arena!" }
      - { move_npc: flamara, to: arena_stadion }

  - id: defeat_pyra
    on: state flamara
    when: { at: flamara, room: arena_stadion }
    once: true
    effects:
      - { set_flag: pyra_besiegt }
      - { msg: "Flamaras Flammen erloeschen. Pyra verbeugt sich: 'Unglaublich! Du bist bereit fuer den Champion Viktor!'" }
      - { add_var: { var: "party.glutling.xp", delta: 60 } }
      - { add_var: { var: "party.nassling.xp", delta: 60 } }
      - { add_var: { var: "party.blattfink.xp", delta: 60 } }
      - { add_var: { var: "party.felsling.xp", delta: 60 } }
      - { msg: "Dein Team erhaelt 60 Erfahrungspunkte!" }

  # Champion Viktor
  - id: challenge_viktor
    on: command herausfordern
    when: { all: [{ at: player, room: arena_stadion }, { has_flag: pyra_besiegt }, { not: { has_flag: liga_gewonnen } }] }
    effects:
      - { msg: "Champion Viktor ruft Krateron in die Arena!" }
      - { move_npc: krateron, to: arena_stadion }

  - id: defeat_viktor
    on: state krateron
    when: { all: [{ has_flag: pyra_besiegt }, { at: krateron, room: arena_stadion }] }
    once: true
    effects:
      - { set_flag: liga_gewonnen }
      - { msg: "Der maechtige Krateron stuerzt auf die Knie! Die gesamte Arena jubelt auf!" }
      - if: { compare_var: { name: dex_count, op: gte, value: 3 } }
        then:
          - { set_flag: sieg_gemeldet }
          - { msg: "VICTORY — Meister-Ranger der Monster-Insel! Du hast alle Trainer bezwungen und deinen Pokédex vervollstaendigt!" }
          - { game_end: victory }
        else:
          - { msg: "Viktor gratuliert dir zum Sieg, aber dein Dex braucht noch mehr dokumentierte Arten! Fange mindestens 3 Monsterarten!" }

  - id: check_dex_after_league
    on: turn
    when: { all: [{ has_flag: liga_gewonnen }, { compare_var: { name: dex_count, op: gte, value: 3 } }, { not: { has_flag: sieg_gemeldet } }] }
    once: true
    effects:
      - { set_flag: sieg_gemeldet }
      - { msg: "VICTORY — Meister-Ranger der Monster-Insel! Du hast alle Trainer bezwungen und deinen Pokédex vervollstaendigt!" }
      - { game_end: victory }

tests:
  - name: "siegeszug durch alle biome und meisterschaft in der arena"
    input:
      - look
      - watch monitor
      - take ball
      - west
      - north
      - use-ability fangball auf nassling
      - south
      - east
      - east
      - north
      - use-ability fangball auf blattfink
      - south
      - west
      - south
      - south
      - use-ability fangball auf glutling
      - switch glutling
      - north
      - north
      - north
      - north
      - herausfordern jan
      - attack flossler
      - herausfordern lea
      - glutstoss borkenkauz
      - herausfordern bruno
      - switch nassling
      - aquawelle gargol
      - herausfordern pyra
