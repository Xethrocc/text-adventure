    =========================================================================
    TURNIER-AUS — Dein Lauf in der Liga ist beendet!
    Ohne einsatzfaehiges Team oder nach vorzeitiger Aufgabe
    scheidest du aus der Arena-Liga aus.
    Uebe fleissig weiter im Safari-Park fuer die naechste Saison!

