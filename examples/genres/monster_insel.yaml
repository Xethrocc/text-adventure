        +===============================================+
      - |
        +===============================================+
        |   [ * ]  TREFFER! Der Ball saugt Energie ein! |
        +===============================================+
      - |
        +===============================================+
        |   ( * )  ... der Safari-Ball wackelt ...     |
        +===============================================+
      - |
        +===============================================+
        |   ( * )  ... ein zweites Mal ...             |
        +===============================================+
      - |
        +===============================================+
        |  [ KLICK! ] GEFANGEN! Das Monster ist dein!  |
        +===============================================+

  - id: clip_levelup
    fps: 4
    frames:
      - |
        +===============================================+
        |      . : * : .                                |
        |   Ein Funke wahrer Kampferfahrung glueht auf! |
        +===============================================+
      - |
        +===============================================+
        |    * : # # # : *                              |
        |   Kraftvolle Elementarenergie stroemt ein!    |
        +===============================================+
      - |
        +===============================================+
