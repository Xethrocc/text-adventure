        |   Stufe erhoeht! Dein Monster wird staerker!  |
        +===============================================+

variables:
  - { name: dex_count, type: int, initial: 0 }
  - { name: team_level_ups, type: int, initial: 0 }
  - { name: fang_versuch, type: int, initial: 0 }
  - { name: move_type, type: int, initial: 0 }
  - { name: target_type, type: int, initial: 0 }
  - { name: mult, type: int, initial: 1 }
  - { name: eff_damage, type: int, initial: 0 }
  - { name: base_damage, type: int, initial: 40 }
  # Typ-Tags je NPC (§9.1-Rezept)
  - { name: type_tag_glutling, type: text, initial: "feuer" }
  - { name: type_tag_flamara, type: text, initial: "feuer" }
  - { name: type_tag_krateron, type: text, initial: "feuer" }
  - { name: type_tag_nassling, type: text, initial: "wasser" }
  - { name: type_tag_flossler, type: text, initial: "wasser" }
  - { name: type_tag_blattfink, type: text, initial: "blatt" }
  - { name: type_tag_borkenkauz, type: text, initial: "blatt" }
  - { name: type_tag_felsling, type: text, initial: "stein" }
  - { name: type_tag_gargol, type: text, initial: "stein" }

abilities:
  - id: fangball
    name: "Safari-Ball werfen"
    effects:
      # Ball ist Pflicht, wird aber nicht verbraucht: ein konsumiertes Item kann
      # `give:` nicht zurueckholen (FIX-02), sonst waere nach einem Fang Schluss.
      - if: { has_item: safariball }
        then:
          - { set_var: { name: fang_versuch, value: 1 } }
        else:
          - { msg: "Du hast keinen Safari-Ball mehr im Rucksack! Hole Nachschub aus der Zentrale." }

  - id: glutstoss
    name: "Glutstoss"
    effects:
      - { set_var: { name: move_type, value: 1 } }
      - { msg: "Glutstoss: Lodernde Feuerfunken zischen auf das Ziel!" }

  - id: aquawelle
    name: "Aquawelle"
    effects:
      - { set_var: { name: move_type, value: 2 } }
      - { msg: "Aquawelle: Ein reissender Wasserstrahl schlaegt ein!" }

  - id: blatttanz
    name: "Blatttanz"
    effects:
      - { set_var: { name: move_type, value: 3 } }
      - { msg: "Blatttanz: Wirbelnde Klingen aus Dornenlaub schneiden durch die Luft!" }

  - id: steinwurf
    name: "Steinwurf"
    effects:
      - { set_var: { name: move_type, value: 4 } }
      - { msg: "Steinwurf: Ein wuchtiger Felsbrocken donnert auf das Ziel!" }

verbs:
  - { name: folgen, aliases: [follow, begleiten, mitkommen] }
  - { name: switch, aliases: [wechsel, wechseln, tausche, tauschen] }
  - { name: fangen, aliases: [ball, werfen, capture, catch] }
  - { name: herausfordern, aliases: [fordern, challenge, duellieren] }
  - { name: aufgeben, aliases: [surrender, forfeit, aufgabe] }
  - { name: glutstoss, aliases: [feuerstoss, feuerangriff] }
  - { name: aquawelle, aliases: [wasserwelle, wasserangriff] }
  - { name: blatttanz, aliases: [rankenhieb, blattangriff] }
  - { name: steinwurf, aliases: [felswurf, steinangriff] }

encounter_tables:
  - id: strand_zone
    on: turn
    cooldown: 2
    when: { any: [{ at: player, room: strand }, { at: player, room: strand_lagune }] }
    entries:
      - { weight: 3, effects: [{ msg: "Die Meeresbrise weht erfrischend: Ein wildes Nassling taucht auf und platscht in den Wellen!" }] }
      - { weight: 2, effects: [{ msg: "Sanfte Brandung rauscht ueber den weissen Korallensand." }] }

  - id: dschungel_zone
    on: turn
    cooldown: 2
    when: { any: [{ at: player, room: dschungel }, { at: player, room: dschungel_dickicht }] }
    entries:
      - { weight: 3, effects: [{ msg: "Lianen schwingen im Dickicht: Ein wilder Blattfink fluegelt aufgeregt durch das Gruen!" }] }
      - { weight: 2, effects: [{ msg: "Sonnenstrahlen malen goldene Flecken auf den feuchten Waldboden." }] }

  - id: vulkan_zone
    on: turn
    cooldown: 2
    when: { any: [{ at: player, room: vulkan_pfad }, { at: player, room: vulkan_krater }] }
    entries:
      - { weight: 3, effects: [{ msg: "Schwefeldampf steigt empor: Funken spruehen, als ein wilder Glutling herumhuepft!" }] }
      - { weight: 2, effects: [{ msg: "Die Basaltfelsen strahlen noch immer die sengende Waerme des Erdinneren ab." }] }

  - id: hoehle_zone
    on: turn
    cooldown: 2
    when: { any: [{ at: player, room: hoehle_eingang }, { at: player, room: hoehle_tiefe }] }
    entries:
      - { weight: 3, effects: [{ msg: "Steine poltern: Ein runder Felsling kullert neugierig an dir vorbei!" }] }
      - { weight: 2, effects: [{ msg: "Tropfsteinspitzen glitzern im Daemmerlicht der unterirdischen Hoehle." }] }

rooms:
  # Ebene 0: Oberwelt (Park-Zentrale, Strand, Dschungel, Vulkan, Arena)
  - id: park_zentrale
    name: "Ranger-Zentrale"
    desc: >
      Willkommen im Safari-Park der Monster-Insel! Auf dem Schreibtisch
      flimmert das Ranger-Terminal ('watch monitor').
      Pfade fuehren nach Westen zum Sonnenstrand, nach Osten in den
      Smaragddschungel, nach Sueden zum Vulkanpfad und nach Norden zum
      Vorplatz der Arena-Liga.
    floor: 0
    map: { x: 2, y: 2 }
    exits:
      west: { to: strand }
      east: { to: dschungel }
      south: { to: vulkan_pfad }
      north: { to: arena_vorplatz }
    on_enter:
      - if: { not: { has_flag: start_ausruestung } }
        then:
          - { set_flag: start_ausruestung }
          - { give: safariball }
          - { msg: "Ranger-Ausruestung erhalten: Safari-Baelle wurden in deinen Rucksack gelegt!" }

  - id: strand
    name: "Sonnenstrand"
    desc: >
      Sonnenstrand: Goldgelber Sandstrand unter tropischer Sonne. Tuerkisblaues Wasser
      schlaegt schaeumend an die Kueste. Im Osten liegt die Ranger-Zentrale,
      waehrend der Ufersaum nach Norden zur Korallenlagune fuehrt.
    floor: 0
    map: { x: 1, y: 2 }
    exits:
      east: { to: park_zentrale }
      north: { to: strand_lagune }

  - id: strand_lagune
    name: "Korallenlagune"
    desc: >
      Korallenlagune: Eine flache, geschuetzte Lagune voller bunter Seesterne und Wasserpflanzen.
      Hier leben die Wassermonster der Insel. Nach Sueden geht es zurueck zum Strand.
    floor: 0
    map: { x: 1, y: 1 }
    exits:
      south: { to: strand }

  - id: dschungel
    name: "Smaragddschungel"
    desc: >
      Smaragddschungel: Ein ueppiger Regenwald mit uralten Wipfeln und riesigen Moosfarnen.
      Exotische Vogelrufe hallen durch die Luft. Im Westen liegt die
      Ranger-Zentrale, nach Norden schlaengelt sich ein Pfad ins dichte Dickicht.
    floor: 0
    map: { x: 3, y: 2 }
    exits:
      west: { to: park_zentrale }
      north: { to: dschungel_dickicht }

  - id: dschungel_dickicht
    name: "Geheimnisvolles Dickicht"
    desc: >
      Geheimnisvolles Dickicht: Dornenranken und dichte Blaetterwaende bilden eine verborgene Waldlichtung.
      Hier nisten die Blatt- und Pflanzenmonster. Nach Sueden gelangst du zurueck.
    floor: 0
    map: { x: 3, y: 1 }
    exits:
      south: { to: dschungel }

  - id: vulkan_pfad
    name: "Glutpfad am Vulkan"
    desc: >
      Glutpfad am Vulkan: Ein schroffer Pfad aus erstarrter Lava zieht sich den Berghang empor.
      Hitze steigt aus Erdspalten auf. Im Norden liegt die Ranger-Zentrale,
      nach Sueden geht es zum rauchenden Krater. Ein finsterer Schlund fuehrt
      nach unten ('down') in die Kristallgrotte.
    floor: 0
    map: { x: 2, y: 3 }
    exits:
      north: { to: park_zentrale }
      south: { to: vulkan_krater }
      down: { to: hoehle_eingang }

  - id: vulkan_krater
    name: "Feuerkrater"
    desc: >
      Feuerkrater: Der Gipfel des Vulkans! Flammende Asche tanzt ueber brodelnden Lavaseen.
      Hier fuehlen sich Feuermonster zuhause. Nach Norden fuehrt der Pfad hinab.
    floor: 0
    map: { x: 2, y: 4 }
    exits:
      north: { to: vulkan_pfad }

  - id: arena_vorplatz
    name: "Vorplatz der Liga"
    desc: >
      Vorplatz der Liga: Ein praechtiger Platz vor der grossen Arena. Bunte Wimpel flattern im
      Wind. Im Sueden liegt die Park-Zentrale, nach Norden oeffnet sich das
      grosse Portal zur Arena der Champions.
    floor: 0
    map: { x: 2, y: 1 }
    exits:
      south: { to: park_zentrale }
      north: { to: arena_stadion }

  - id: arena_stadion
    name: "Arena der Champions"
    desc: >
      Arena der Champions: Das monumentale Sandoval der Insel-Liga! Tausende begeisterte Fans
      jubeln von den Tribuenen. Flutlichtmasten tauchen den Kampfring in
      strahlenden Schein. Im Sueden liegt das Ausgangsportal, im Osten der Warteraum.
    floor: 0
    map: { x: 2, y: 0 }
    exits:
      south: { to: arena_vorplatz }
      east: { to: arena_wartesaal }
    ascii:
      default: |
        +------------------------------------------------+
        |  [=== ARENA DER CHAMPIONS - LIGA-STADION ===]  |
        |      \O/     \O/     \O/     \O/     \O/       |
        |  ============================================  |
        +------------------------------------------------+
      ambient:
        fps: 2
        frames:
          - |
            [ *** ARENA DER CHAMPIONS - JUBEL BRANDET AUF! *** ]
          - |
            [ *** FLUTLICHT BLITZT UEBER DEM KAMPFFELD! *** ]

  - id: arena_wartesaal
    name: "Warteraum der Arena"
    desc: >
      Warteraum der Arena: Hier bereiten sich die Trainer und ihre Monster auf den Kampf vor.
      Nach Westen fuehrt die Tuer direkt in den Kampfring der Arena.
    floor: 0
    map: { x: 3, y: 0 }
    exits:
      west: { to: arena_stadion }

  # Ebene 1: Hoehle / Untergrund (floor: 1)
  - id: hoehle_eingang
    name: "Kristallgrotte"
    desc: >
      Kristallgrotte: Eine kuehle Hoehle tief im Berg. Schimmernde Kristalle leuchten blau
      an den Tropfsteinwaenden. Eine Steinstiege fuehrt nach oben ('up') zum
      Vulkanpfad. Im Norden oeffnet sich die tiefe Basaltkammer.
    floor: 1
    map: { x: 2, y: 3 }
    exits:
      up: { to: vulkan_pfad }
      north: { to: hoehle_tiefe }

  - id: hoehle_tiefe
    name: "Tiefste Basaltkammer"
    desc: >
      Tiefste Basaltkammer: Gewaltige Felssaeulen stuetzen das unterirdische Gewoelbe. Rollende
      Steine verraten die Anwesenheit von Gesteinsmonstern. Nach Sueden geht
      es zurueck zur Kristallgrotte.
    floor: 1
    map: { x: 2, y: 2 }
    exits:
      south: { to: hoehle_eingang }

items:
  - id: safariball
    name: "Safari-Ball"
    gender: m
    article: { nom: der, acc: den, dat: dem }
    keys: [ball, safariball, safaribaelle, pokeball]
    location: park_zentrale
    portable: true
    desc: "Eine hochmoderne Ranger-Kapsel zum schonenden Einfangen wilder Inselmonster."

  - id: ball_depot
    name: "Ball-Depot"
    gender: n
    article: { nom: das, acc: das, dat: dem }
    keys: [depot, kiste, box, tisch]
    location: park_zentrale
    portable: false
    desc: "Ein Nachschublager mit handlichen Safari-Baellen fuer Ranger ('take ball')."
    verb_map:
      take,intact:
        - { give: safariball }
        - { msg: "Du nimmst dir einen weiteren Safari-Ball aus dem Vorrat." }

  - id: ranger_monitor
    name: "Ranger-Terminal"
    gender: n
    article: { nom: das, acc: das, dat: dem }
    keys: [monitor, terminal, bildschirm, display, infoterminal]
    location: park_zentrale
    portable: false
    desc: "Ein Monitor mit Live-Sensorik des Safari-Parks ('watch monitor')."
    ascii:
      frames:
        - |
          +---[ RANGER TERMINAL: STATUS INSEL ]---+
          | Strand [O]  Dschungel [O]  Vulkan [O] |
          | Hoehle [O]  Liga-Arena [O]            |
          +---------------------------------------+
        - |
          +---[ RANGER TERMINAL: SCANNING ]-------+
          | * Wilde Monster auf der Insel aktiv * |
          | Ziel: 3+ Arten fangen & Liga schlagen |
          +---------------------------------------+
      every: 2

npcs:
  # 1. Fangbare Wilde Monster (C4: combat_slot & xp_table)
  - id: glutling
    name: Glutling
    gender: m
    article: { nom: der, acc: den, dat: dem }
    desc: "Ein feuriges Echsenwesen mit einer lodernden Flamme am Schweif."
    keys: [glutling, feuermonster]
    location: vulkan_krater
    state: alive
    max_hp: 25
    attack: 7
    defense: 2
    party:
      can_join: true
      order_verb: folgen
      hp_tracked: true
      combat_slot: 1
      switch_verb: switch
      follow_msg: "Glutling schliesst sich deinem Team an!"
      stay_msg: "Glutling wartet am warmen Lagerplatz."
      xp_table:
        - { level: 1, xp: 0, name: "Glutling (Basis)" }
        - { level: 2, xp: 50, name: "Glutling (Flamme)", msg: "Glutling erreicht Stufe 2! Seine Flammen lodern heller!", effects: [{ play_clip: clip_levelup }, { add_var: { var: team_level_ups, delta: 1 } }] }
    ascii:
      default: |
        [ Glutling - Typ: Feuer ]
           ( \
          ( \ \
         ( ) ) )
          ( o.o )
           > ^ <

  - id: nassling
    name: Nassling
    gender: m
    article: { nom: der, acc: den, dat: dem }
    desc: "Ein froehlicher Wassersalamander mit glaenzenden, blauen Schuppen."
    keys: [nassling, wassermonster]
    location: strand_lagune
    state: alive
    max_hp: 25
    attack: 6
    defense: 3
    party:
      can_join: true
      order_verb: folgen
      hp_tracked: true
      combat_slot: 2
      switch_verb: switch
      follow_msg: "Nassling schliesst sich deinem Team an!"
      stay_msg: "Nassling taucht entspannt im Wasser ab."
      xp_table:
        - { level: 1, xp: 0, name: "Nassling (Basis)" }
        - { level: 2, xp: 50, name: "Nassling (Flut)", msg: "Nassling erreicht Stufe 2! Seine Wasserstrahlen werden maechtiger!", effects: [{ play_clip: clip_levelup }, { add_var: { var: team_level_ups, delta: 1 } }] }
    ascii:
      default: |
        [ Nassling - Typ: Wasser ]
            _.~"~._
          .' O   O '.
         /  (  _  )  \
        |    `---'    |
         \  \_____/  /

  - id: blattfink
    name: Blattfink
    gender: m
    article: { nom: der, acc: den, dat: dem }
    desc: "Ein flinker Waldvogel, dessen Gefieder aus scharfen Laubklingen besteht."
