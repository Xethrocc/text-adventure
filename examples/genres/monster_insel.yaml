    location: dschungel_dickicht
    state: alive
    max_hp: 22
    attack: 7
    defense: 2
    party:
      can_join: true
      order_verb: folgen
      hp_tracked: true
      combat_slot: 3
      switch_verb: switch
      follow_msg: "Blattfink schliesst sich deinem Team an!"
      stay_msg: "Blattfink laesst sich auf einem Zweig nieder."
      xp_table:
        - { level: 1, xp: 0, name: "Blattfink (Basis)" }
        - { level: 2, xp: 50, name: "Blattfink (Sturm)", msg: "Blattfink erreicht Stufe 2! Sein Blaetterkleid glaenzt smaragdgruen!", effects: [{ play_clip: clip_levelup }, { add_var: { var: team_level_ups, delta: 1 } }] }
    ascii:
      default: |
        [ Blattfink - Typ: Blatt ]
             _ _
           /'   `\
          (  o>   )
           \  == /
           /`---'\

  - id: felsling
    name: Felsling
    gender: m
    article: { nom: der, acc: den, dat: dem }
    desc: "Ein rollendes Kieselwesen mit dickem Granitpanzer und treuen Kulleraugen."
    keys: [felsling, steinmonster, kiesel]
    location: hoehle_tiefe
    state: alive
    max_hp: 30
    attack: 6
    defense: 4
    party:
      can_join: true
      order_verb: folgen
      hp_tracked: true
      combat_slot: 4
      switch_verb: switch
      follow_msg: "Felsling schliesst sich deinem Team an!"
      stay_msg: "Felsling rollt sich gemuetlich am Fels zusammen."
      xp_table:
        - { level: 1, xp: 0, name: "Felsling (Basis)" }
        - { level: 2, xp: 50, name: "Felsling (Granit)", msg: "Felsling erreicht Stufe 2! Sein Panzer wird steinhart!", effects: [{ play_clip: clip_levelup }, { add_var: { var: team_level_ups, delta: 1 } }] }
    ascii:
      default: |
        [ Felsling - Typ: Stein ]
            .-----.
           / -   - \
          | [o] [o] |
          |    =    |
           \_______/

  # 2. Arena-Liga: Schiedsrichter, Trainer & deren Monster
  - id: schiedsrichter
    name: "Liga-Schiedsrichter"
    gender: m
    article: { nom: der, acc: den, dat: dem }
    desc: "Der offizielle Schiedsrichter der Insel-Liga. Ueberwacht die Kaempfe gegen Jan, Lea, Bruno, Pyra und Viktor!"
    keys: [schiedsrichter, leiter, ref, meister]
    location: arena_stadion
    state: alive

  - id: trainer_jan
    name: "Trainer Jan"
    gender: m
    article: { nom: der, acc: den, dat: dem }
    desc: "Ein energischer Wassertrainer mit Neoprenanzug ('herausfordern jan')."
    keys: [jan, trainer_jan, trainer]
    location: arena_stadion
    state: alive

  - id: flossler
    name: Flossler
    gender: m
    article: { nom: der, acc: den, dat: dem }
