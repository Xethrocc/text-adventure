# Das Theater der Schatten — Ein Puppentheater-Adventure
#
# Genre: ASCII-/TUI-Showcase & Puppentheater
# Benchmark: C7 (Content-Benchmark Das Theater der Schatten)
#
# Feature-Mapping (gemaess docs/spielideen.md §3 & plan-theater-der-schatten.md):
#   - Vorhang auf/zu: Zwischensequenzen (clips) beim Betreten der Buehnenraeume
#   - Kulissen: Wechsel ueber CondText (variants mit when), gesteuert durch Spielaktionen
#   - Puppen: NPCs als Hotspots auf der Buehne (look at <n>, talk to <n>)
#   - Akte / Szenen: Ambient-Loops im Hintergrund (flackernde Kerzen, fallender Schnee, Wind)
#   - Titel und Ende: Theaterplakate aus text2ascii (title_art / end_art victory & abbruch)
#   - Siegpfad (Finale) + Fail-Pfad (Vorhang faellt vorzeitig)
#
# Aufbau:
#   Akt I:   Das Vorspiel (Buehne 1 — Der Marktplatz der Schatten)
#            Clip: vorhang_auf_akt1
#            Ambient: Flackernde Laternen / Fackelschein
#            Hotspots: Puppe Pierrot [P], Requisitenkiste [K]
#            Aufgabe: Requisite 'Laterne' entzuenden und Pierrot uebergeben.
#   Akt II:  Das Hauptstueck (Buehne 2 — Der Winterwald)
#            Clip: vorhang_auf_akt2
#            Ambient: Fallender Schnee
#            Hotspots: Puppe Jaeger [J], Kristallbaum [B]
#            Aufgabe: Silberpfeil schnitzen / einsetzen, um den Waldpfad zu klaeren.
#   Akt III: Das Finale (Buehne 3 — Der Spiegelsaal)
#            Clip: vorhang_auf_akt3
#            Ambient: Zirkulierender Schattenwind
#            Hotspots: Schattenkoenigin [Q], Schattenspiegel [S]
#            Aufgabe: Zauberspiegel mit der Laterne erleuchten und das Meisterwerk auffuehren.
#            Fail-Option: Am Seilzug ziehen oder Vorhang zerreissen -> vorzeitiger Abbruch!

