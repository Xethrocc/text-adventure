name: "Spire of Fate (Deckbuilder)"
start_room: "turmfuss"

player:
  max_hp: 80

combat:
  profile: "classic"

variables:
  - name: "energy"
    type: int
    initial: 3
    min: 0
    max: 3
  - name: "block"
    type: int
    initial: 0
    min: 0
  - name: "strength"
    type: int
    initial: 0
  # Schutz gegen Gegenangriffe: die Engine setzt `block` bei `end turn` auf 0,
  # bevor die Zugende-Regeln laufen — darum zählt `schild` mit (wie krypta).
  - name: "schild"
    type: int
    initial: 0
    min: 0

verbs:
  - name: "status"
    aliases: ["stats", "charakter"]
  - name: "rasten"
    aliases: ["rest", "ausruhen"]
  - name: "trinken"
    aliases: ["drink", "schlucken"]

rooms:
  - id: "turmfuss"
    name: "Fuß des Spire"
    desc: "Ein finsterer Turm ragt in die Wolken. Dein Deck ist bereit für den Aufstieg."
    exits:
      north: "kobold_lager"

  - id: "kobold_lager"
    name: "Vorposten des Goblins"
    desc: "Ein scharfzahniger Goblin lauert hier mit gezogenem Dolch!"
    exits:
      south: "turmfuss"
      north: "schrein"

  - id: "schrein"
    name: "Uralter Schrein"
    desc: "Eine Oase der Ruhe. Sanftes Licht erhellt antike Runen."
    exits:
      south: "kobold_lager"
      north: "gipfel"

  - id: "gipfel"
    name: "Gipfel des Spire"
    desc: "Ein titanischer Wächter aus lebendem Stein versperrt das Tor zur Freiheit!"
    exits:
      south: "schrein"

items:
  - id: "elixier"
    name: "Lebenselixier"
    desc: "Ein schimmernder roter Trank."
    location: "turmfuss"
    keys: ["trank", "elixier", "potion"]
    verb_map:
      trinken:
        - heal: 20
        - consume: "elixier"
        - msg: "Du trinkst das Lebenselixier und regenerierst 20 Lebenspunkte!"

npcs:
  - id: "kobold"
    name: "Goblin-Späher"
    desc: "Ein garstiger kleiner Goblin mit gelben Zähnen."
    location: "kobold_lager"
    max_hp: 20
    attack: 6
    defense: 0
    state: "idle"

  - id: "sentinel"
    name: "Turmwächter"
    desc: "Ein uralter Wächtergolem aus massiven Felsblöcken."
    location: "gipfel"
    max_hp: 50
    attack: 10
    defense: 2
    state: "idle"

cards:
  strike:
    name: "Hieb"
    cost: { energy: 1 }
    type: attack
    target: single_enemy
    description: "Fügt einem gewählten Feind 6 Schaden zu."
    outcomes:
      - damage_enemy: { target: chosen, amount: 6 }

  defend:
    name: "Verteidigung"
    cost: { energy: 1 }
    type: skill
    target: self
    description: "Erhöht den Schutz um 5 Block."
    outcomes:
      - add_var: { variable: block, delta: 5 }
      - add_var: { variable: schild, delta: 5 }

  bash:
    name: "Schmetterschlag"
    cost: { energy: 2 }
    type: attack
    target: single_enemy
    description: "Fügt 8 schweren Schaden zu. Kombo mit Verteidigung: +4 Schildschlag-Schaden!"
    outcomes:
      - damage_enemy: { target: chosen, amount: 8 }
      - if: { card_in_hand: defend }
        then:
          - damage_enemy: { target: chosen, amount: 4 }
          - msg: "Kombo-Synergie! Verteidigung auf der Hand verstärkt Schmetterschlag um 4 Bonusschaden!"

  cleave:
    name: "Rundumschlag"
    cost: { energy: 1 }
    type: attack
    target: all_enemies
    description: "Fügt allen anwesenden Feinden 4 Schaden zu."
    outcomes:
      - damage_all_enemies: 4

  shrug:
    name: "Abprallen"
    cost: { energy: 1 }
    type: skill
    target: self
    description: "Gewährt 8 Block und zieht 1 Karte."
    outcomes:
      - add_var: { variable: block, delta: 8 }
      - add_var: { variable: schild, delta: 8 }
      - draw_cards: 1

  battle_trance:
    name: "Kampftrance"
    cost: {}
    type: skill
    target: self
    description: "Kostenlos: Ziehe 3 Karten."
    outcomes:
      - draw_cards: 3

handLimit: 5
deck:
  strike: 4
  defend: 4
  bash: 1
  shrug: 1

rules:
  # --- Gegenangriff: Goblin-Späher sticht am Zugende zu ---
  - id: kobold_gegenangriff
    on: "command end_turn"
    when:
      all:
        - at: player
          room: kobold_lager
        - not:
            state: kobold
            is: dead
    effects:
      - if: { compare_var: { name: schild, op: gte, value: 6 } }
        then:
          - msg: "Der Goblin sticht mit seinem Dolch zu, doch dein Block fängt den Stich ab!"
        else:
          - if: { compare_var: { name: schild, op: gt, value: 0 } }
            then:
              - damage: 3
              - msg: "Der Dolch des Goblins gleitet an deinem Block ab und ritzt dich! (-3 HP, verbleibend: {player.hp})"
            else:
              - damage: 6
              - msg: "Der Goblin rammt dir seinen Dolch in die Seite! (-6 HP, verbleibend: {player.hp})"
      - set_var: { var: schild, value: 0 }

  # --- Gegenangriff: Turmwächter schlägt am Zugende zu ---
  - id: sentinel_gegenangriff
    on: "command end_turn"
    when:
      all:
        - at: player
          room: gipfel
        - not:
            state: sentinel
            is: dead
    effects:
      - if: { compare_var: { name: schild, op: gte, value: 10 } }
        then:
          - msg: "Der Turmwächter lässt seine Steinfaust niedersausen, doch dein Block hält stand!"
        else:
          - if: { compare_var: { name: schild, op: gt, value: 0 } }
            then:
              - damage: 5
              - msg: "Die Steinfaust des Turmwächters zertrümmert deinen Block teilweise! (-5 HP, verbleibend: {player.hp})"
            else:
              - damage: 10
              - msg: "Die Steinfaust des Turmwächters trifft dich mit voller Wucht! (-10 HP, verbleibend: {player.hp})"
      - set_var: { var: schild, value: 0 }

  # --- Turmwächter besiegt: Sieg ---
  - id: sentinel_tod
    on: "state sentinel"
    effects:
      - msg: "Der Turmwächter zerbricht in einen Haufen lebloser Felsbrocken! Das Tor zur Freiheit schwingt auf."
      - game_end: victory
      - msg: "Du hast den Spire of Fate bezwungen!"

tests:
  - name: "sieg_nach_tod_des_turmwaechters"
    input:
      - "north"
      - "attack kobold"
      - "end turn"
      - "play 1"
      - "north"
      - "north"
      - "play 1"
      - "end turn"
      - "play 2"
      - "play 2"
      - "play 2"
      - "end turn"
      - "play 3"
      - "play 3"
      - "play 1"
      - "end turn"
      - "play 5"
      - "play 1"
      - "end turn"
      - "play 5"
      - "play 3"
      - "play 4"
    expect:
      - "Der Goblin rammt dir seinen Dolch in die Seite! (-6 HP, verbleibend: 73)"
      - "Die Steinfaust des Turmwächters zertrümmert deinen Block teilweise! (-5 HP, verbleibend: 68)"
      - "Die Steinfaust des Turmwächters trifft dich mit voller Wucht! (-10 HP, verbleibend: 58)"
      - "Der Turmwächter lässt seine Steinfaust niedersausen, doch dein Block hält stand!"
      - "Die Steinfaust des Turmwächters trifft dich mit voller Wucht! (-10 HP, verbleibend: 48)"
      - "Der Turmwächter zerbricht in einen Haufen lebloser Felsbrocken! Das Tor zur Freiheit schwingt auf."
      - "Du hast den Spire of Fate bezwungen!"

  - name: "niederlage_durch_gegenangriffe"
    input:
      - "north"
      - "north"
      - "north"
      - "end turn"
      - "end turn"
      - "end turn"
      - "end turn"
      - "end turn"
      - "end turn"
      - "end turn"
      - "end turn"
    expect:
      - "Die Steinfaust des Turmwächters trifft dich mit voller Wucht! (-10 HP, verbleibend: 10)"
      - "Die Steinfaust des Turmwächters trifft dich mit voller Wucht! (-10 HP, verbleibend: 0)"
