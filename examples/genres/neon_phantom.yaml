rules:
  # Quest-Start
  - id: quest_start
    on: enter vent_shaft
    once: true
    effects:
      - start_quest: heist_chimera
      - msg: "Auftrag erfasst: 'SubNet-Infiltration' gestartet! Ziel: Projekt Chimera bergen."

  # Quest-Fortschritt bei Betreten des Trakts
  - id: quest_stage_subnet
    on: enter security_corridor
    once: true
    effects:
      - advance_quest: heist_chimera

  # Schluesselchip geborgen
  - id: keychip_geborgen
    on: turn
    once: true
    when:
      has_item: keychip
    effects:
      - set_flag: has_keychip
      - learn: sato_schluessel_vektor
      - add_var: { var: score, delta: 30 }
      - msg: "Kurosawa-Schluesselchip geborgen! Der kryptografische Vektor synchronisiert sich mit deinem Decompiler (+30 Punkte)."

  # Optik-Kamera im Sicherheitskorridor schlaegt an, wenn online
  - id: camera_detection
    on: enter security_corridor
    when:
      not: { has_flag: camera_offline }
    effects:
      - add_var: { var: trace, delta: 25 }
      - msg: >
          ALARM: Die Kurosawa-Optikueberwachung an der Decke schlaegt an!
          Ein roter Laserstrahl scannt deinen Koerper. Der Trace-Pegel steigt drastisch an (+25 % Trace)!
          Tipp: Klinke dich im Lueftungsschacht ins SubNet ein und ueberlaste 'camera_node'!

  # Einklinken ins SubNet (an gueltigen Anschluessen)
  - id: jack_in_cmd
    on: command jack
    effects:
      - if:
          any:
            - { at: player, room: vent_shaft }
            - { at: player, room: guard_room }
            - { at: player, room: server_room }
        then:
          - if: { at: player, room: vent_shaft }
            then:
              - set_var: { var: jack_origin, value: 1 }
          - if: { at: player, room: guard_room }
            then:
              - set_var: { var: jack_origin, value: 2 }
          - if: { at: player, room: server_room }
            then:
              - set_var: { var: jack_origin, value: 3 }
          - move: subnet_gateway
          - msg: >
              Du stoepselst das Monokabel deines Cyberdecks in die Datenbuchse...
              Dein Bewusstsein loest sich vom Fleisch. Ein Vektorgitter aus gleissendem
              Cyan und Schwarz spannt sich um dich auf. Willkommen im Kurosawa-SubNet!
        else:
          - msg: "Hier gibt es keine Klinkenbuchse fuer dein Cyberdeck. Suche ein Terminal oder einen Wartungsanschluss!"

  # Ausklinken aus dem SubNet zurueck in den physischen Koerper
  - id: disconnect_cmd
    on: command disconnect
    effects:
      - if:
          any:
            - { at: player, room: subnet_gateway }
            - { at: player, room: ice_bastion }
            - { at: player, room: central_mainframe }
        then:
          - if: { compare_var: { name: jack_origin, op: eq, value: 1 } }
            then:
              - move: vent_shaft
          - if: { compare_var: { name: jack_origin, op: eq, value: 2 } }
            then:
              - move: guard_room
          - if: { compare_var: { name: jack_origin, op: eq, value: 3 } }
            then:
              - move: server_room
          - msg: >
              Notfall-Klinkentrennung! Ein stechender Ruck faehrt durch deine Synapsen,
              als das digitale Gitter kollabiert. Deine Augen oeffnen sich wieder in der
              physischen Realitaet.
        else:
          - msg: "Du bist derzeit in kein Netzwerk eingeklinkt."

  # Cyberdeck-HUD
  - id: cyberdeck_hud
    on: command hud
    effects:
      - msg: >
          =============================================================
          [CYBERDECK HUD] Onyx-Phantom Custom Deck (Militaer-Spezifikation)
          =============================================================
          RAM-SPEICHER : {ram}/6 Bloecke (1 Block regeneriert pro Zug)
          TRACE-PEGEL  : {trace} % (Kritisch ab 70 %, Lockdown bei 100 %)
          HEIST-SCORE  : {score}/350 Punkte
          =============================================================

  # RAM-Regeneration: Jede Runde kuehlt das Deck 1 RAM ab (bis max 6)
  - id: ram_regen
    on: turn
    when:
      compare_var: { name: ram, op: lt, value: 6 }
    effects:
      - add_var: { var: ram, delta: 1 }

  # Trace-Warnung bei >= 70%
  - id: trace_warnung
    on: turn
    once: true
    when:
      compare_var: { name: trace, op: gte, value: 70 }
    effects:
      - msg: "KRITISCHE WARNUNG: Trace-Pegel bei {trace} %! Kurosawa Black-ICE lokalisiert deine Neuro-Signatur!"

  # Trace Game Over bei >= 100%
  - id: trace_game_over
    on: turn
    when:
      compare_var: { name: trace, op: gte, value: 100 }
    effects:
      - msg: >
          KATASTROPHALER LOCKDOWN: Trace hat 100 % erreicht!
          Toedliches Kurosawa Black-ICE flutet deine neuralen Implantate.
          Gleichzeitig riegeln Schotten das Gebaeude ab und schwer bewaffnete
          Sicherheitskraefte eroeffnen das Feuer. Dein Gehirn kocht -- dein Signal erlischt.
      - game_end: death
      - msg: "GAME OVER — Neuro-Schock durch Black-ICE. Du wurdest im Netz verbrannt."

  # Sieg-Bedingung: Extraktion mit Projekt Chimera
  - id: sieg_extraktion
    on: enter extraction_point
    when:
      has_flag: chimera_acquired
    effects:
      - complete_quest: heist_chimera
      - add_var: { var: score, delta: 40 }
      - msg: "Du schluepfst in Nixies AV-Gleiter. Die Triebwerke zuenden und ihr taucht im Neonmeer unter!"
      - game_end: victory
      - msg: "SIEG — Heist erfolgreich abgeschlossen! Endstand: {score}/350 Punkte."

