# Stehlen: der Dieb räumt dem Spieler die Schätze ab (Original: ROB/THIEF-VS-ADVENTURER).
- id: thief-steals
  on: turn
  when:
    all:
    - not:
        state: thief
        is: dead
    - not:
        has_flag: thief-fighting
    - actor_has_tag:
        actor: player
        tag: schatz
  effects:
  - random:
      stream: thief
      choices:
      - - 25
        - - move_all:
              what: items
              by: player
              tag: schatz
              to:
                by: thief
          - msg: 'A seedy-looking individual with a large bag just wandered through the room. On the way through, he quietly abstracted some valuables from your possession, mumbling something about "Doing unto others before..."'
      - - 70
        - - msg: ''

# --- Stufe E: Lampe an/aus (Original LANTERN / V-LAMP-ON / V-LAMP-OFF,
# 1actions.zil:2220 / gverbs.zil:771,786). Eine Regel mit if/else (R-01:
# aufeinanderfolgende Regeln sehen den bereits geaenderten Zustand). ---
- id: lamp-light
  on: command light
  when:
    all:
    - any:
      - var: cmd.arg1
        is: lamp
      - var: cmd.arg1
        is: lantern
    - has_item: lamp
    - not:
        at: player
        room: gas-room
  effects:
  - if:
      state: lamp
      is: burned-out
    then:
    - msg: A burned-out lamp won't light.
    else:
    - if:
        state: lamp
        is: lit
      then:
      - msg: It is already on.
      else:
      - msg: The lamp is now on.
      - set_state:
          target: lamp
          to: lit

# --- Stufe E: Löschen (Original V-LAMP-OFF, gverbs.zil:771; Verben EXTINGUISH/DOUSE) ---
- id: lamp-out
  on: command extinguish
  when:
    all:
    - any:
      - var: cmd.arg1
        is: lamp
      - var: cmd.arg1
        is: lantern
    - has_item: lamp
  effects:
  - if:
      state: lamp
      is: burned-out
    then:
    - msg: The lamp has already burned out.
    else:
    - if:
        state: lamp
        is: lit
      then:
      - msg: The lamp is now off.
      - set_state:
          target: lamp
          to: off
      else:
      - msg: It is already off.
- id: candles-out
  on: command extinguish
  when:
    all:
    - var: cmd.arg1
      is: candles
    - has_item: candles
  effects:
  - if:
      state: candles
      is: lit
    then:
    - msg: The flame is extinguished.
    - set_state:
        target: candles
        to: unlit
    else:
    - msg: The candles are not lighted.
- id: match-out
  on: command extinguish
  when:
    all:
    - var: cmd.arg1
      is: match
    - has_item: match
  effects:
  - if:
      state: match
      is: lit
    then:
    - msg: The match is out.
    - set_state:
        target: match
        to: unlit
    else:
    - msg: The match is not burning.
# "turn off <x>" als Synonym (Original V-LAMP-OFF kennt TURN OFF / PUT OUT / BLOW OUT;
# der Parser kann nur ein-Wort-Verben, daher hier über `turn` + cmd.arg2).
- id: turn-off-alias
  on: command turn
  when:
    var: cmd.arg1
    is: off
  effects:
  - if:
      any:
      - var: cmd.arg2
        is: lamp
      - var: cmd.arg2
        is: lantern
    then:
    - if:
        state: lamp
        is: burned-out
      then:
      - msg: The lamp has already burned out.
      else:
      - if:
          state: lamp
          is: lit
        then:
        - msg: The lamp is now off.
        - set_state:
            target: lamp
            to: off
        else:
        - msg: It is already off.
    else:
    - if:
        var: cmd.arg2
        is: candles
      then:
      - if:
          state: candles
          is: lit
        then:
        - msg: The flame is extinguished.
        - set_state:
            target: candles
            to: unlit
        else:
        - msg: The candles are not lighted.
      else:
      - if:
          var: cmd.arg2
          is: match
        then:
        - if:
            state: match
            is: lit
          then:
          - msg: The match is out.
          - set_state:
              target: match
              to: unlit
          else:
          - msg: The match is not burning.
        else:
        - msg: You can't turn that off.

# --- Stufe E: Brenndauern (Original I-LANTERN/I-CANDLES/I-MATCH mit LAMP-TABLE
# 200/100/70/15, CANDLE-TABLE 40/20/10/5, I-MATCH 2 — 1actions.zil:2220/2315/2343).
# Reihenfolge innerhalb `on: turn` ist wichtig (R-01): Dimmer-Meldungen VOR dem
# Verbrauchen (sehen den Alt-Wert), Ausbrennen DANACH. Aus = Zustandswechsel
# (lamp/candles → burned-out, match → unlit), `tags_when` löscht damit das Licht.
# Die Timer laufen nur im brennenden Zustand — `extinguish` pausiert sie wie das
# Original (DISABLE <INT I-LANTERN>). ---
- id: lamp-dim-1
  on: turn
  when:
    all:
    - state: lamp
      is: lit
    - compare_var:
        name: lamp_battery
        op: eq
        value: 185
  effects:
  - msg: The lamp appears a bit dimmer.
- id: lamp-dim-2
  on: turn
  when:
    all:
    - state: lamp
      is: lit
    - compare_var:
        name: lamp_battery
        op: eq
        value: 85
  effects:
  - msg: The lamp is definitely dimmer now.
- id: lamp-dim-3
  on: turn
  when:
    all:
    - state: lamp
      is: lit
    - compare_var:
        name: lamp_battery
        op: eq
        value: 15
  effects:
  - msg: The lamp is nearly out.
- id: lamp-burn
  on: turn
  when:
    state: lamp
    is: lit
  effects:
  - add_var:
      var: lamp_battery
      delta: -1
- id: lamp-burnout
  on: turn
  when:
    all:
    - state: lamp
      is: lit
    - compare_var:
        name: lamp_battery
        op: lte
        value: 0
  effects:
  - msg: "You'd better have more light than from the lamp."
  - set_state:
      target: lamp
      to: burned-out
- id: candles-dim-1
  on: turn
  when:
    all:
    - state: candles
      is: lit
    - compare_var:
        name: candles_battery
        op: eq
        value: 35
  effects:
  - msg: The candles grow shorter.
- id: candles-dim-2
  on: turn
  when:
    all:
    - state: candles
      is: lit
    - compare_var:
        name: candles_battery
        op: eq
        value: 15
  effects:
  - msg: The candles are becoming quite short.
- id: candles-dim-3
  on: turn
  when:
    all:
    - state: candles
      is: lit
    - compare_var:
        name: candles_battery
        op: eq
        value: 5
  effects:
  - msg: The candles won't last long now.
- id: candles-burn
  on: turn
  when:
    state: candles
    is: lit
  effects:
  - add_var:
      var: candles_battery
      delta: -1
- id: candles-burnout
  on: turn
  when:
    all:
    - state: candles
      is: lit
    - compare_var:
        name: candles_battery
        op: lte
        value: 0
  effects:
  - msg: "You'd better have more light than from the candles."
  - set_state:
      target: candles
      to: burned-out
- id: match-burn
  on: turn
  when:
    state: match
    is: lit
  effects:
  - add_var:
      var: match_battery
      delta: -1
- id: match-burnout
  on: turn
  when:
    all:
    - state: match
      is: lit
    - compare_var:
        name: match_battery
        op: lte
        value: 0
  effects:
  - msg: The match has gone out.
  - set_state:
      target: match
      to: unlit

# --- Stufe E: Wasser (Original V-FILL / WATER-F, gverbs.zil:471 / 1actions.zil).
# `fill bottle` geht nur an Gewässern — das Original kennt dort GLOBAL-WATER in
# genau diesen 19 Raeumen. ---
- id: fill-bottle
  on: command fill
  when:
    any:
    - var: cmd.arg1
      is: bottle
    - var: cmd.arg1
      is: container
    - var: cmd.arg1
      is: flask
  effects:
  - if:
      in: {container: bottle, item: water}
    then:
    - msg: The bottle is already full.
    else:
    - if:
        any:
        - at: player
          room: reservoir-south
        - at: player
          room: reservoir
        - at: player
          room: reservoir-north
        - at: player
          room: stream-view
        - at: player
          room: in-stream
        - at: player
          room: dam-room
        - at: player
          room: dam-base
        - at: player
          room: river-1
        - at: player
          room: river-2
        - at: player
          room: river-3
        - at: player
          room: river-4
        - at: player
          room: river-5
        - at: player
          room: white-cliffs-north
        - at: player
          room: white-cliffs-south
        - at: player
          room: shore
        - at: player
          room: sandy-beach
        - at: player
          room: aragain-falls
        - at: player
          room: end-of-rainbow
        - at: player
          room: canyon-bottom
      then:
      - msg: The bottle is now full of water.
      - place: {item: water, in_container: bottle}
      else:
      - msg: There's nothing to fill it with.
- id: fill-other
  on: command fill
  when:
    not:
      any:
      - var: cmd.arg1
        is: bottle
      - var: cmd.arg1
        is: container
      - var: cmd.arg1
        is: flask
  effects:
  - msg: You may know how to do that, but I don't.
