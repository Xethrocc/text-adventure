  location: dam-room
  portable: false
  take_failure: It is firmly mounted on the control panel.
  verb_map:
    turn:
    - if:
        all:
        - has_flag: gate-flag
        - has_item: wrench
      then:
      - if:
          has_flag: gates-open
        then:
        - msg: The sluice gates close and water starts to collect behind the dam.
        - set_flag: gates-open
          val: 'false'
        - set_flag: low_tide
          val: 'false'
        else:
        - msg: The sluice gates open and water pours through the dam.
        - set_flag: gates-open
          val: 'true'
        - set_flag: low_tide
          val: 'true'
      else:
      - if:
          not:
            has_flag: gate-flag
        then:
        - msg: The bolt is locked in place. Enable it with the yellow button in the maintenance room first.
        else:
        - msg: You need the wrench to turn the bolt.
