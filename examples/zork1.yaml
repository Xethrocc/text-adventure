- id: book
  name: black book
  description: On the altar is a large black book, open to page 569.
  keys:
  - book
  in_container: altar
  portable: true
  verb_map:
    read:
    - if:
        all:
        - at: player
          room: entrance-to-hades
        - has_flag: exorcism_xc
      then:
      - msg: 'Each word of the prayer reverberates through the hall in a deafening confusion. As the last word fades, a voice, loud and commanding, speaks: "Begone, fiends!" A heart-stopping scream fills the cavern, and the spirits, sensing a greater power, flee through the walls.'
      - consume: ghosts
      - clear_condition: exorcism_xc
      - set_flag: exorcism_xc
        val: 'false'
      - set_flag: lld_flag
        val: 'true'
      else:
      - msg: "Commandment #12592\n\nOh ye who go about saying unto each: \"Hello sailor\":\nDost thou know the magnitude of thy sin before the gods?\nYea, verily, thou shalt be ground between two stones.\nShall the angry gods cast thy body into the whirlpool?\nSurely, thy eye shall be put out with a sharp stick!\nEven unto the ends of the earth shalt thou wander and\nUnto the land of the dead shalt thou be sent at last.\nSurely thou shalt repent of thy cunning."
