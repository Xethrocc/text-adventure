name: 'Zork I: The Great Underground Empire'
start_room: west-of-house
player:
  max_hp: 30
  attack: 10
  defense: 3
end_art:
  victory: "=========================================\n  YOU WIN\n=========================================\n  You have conquered the Great Underground Empire."
  death: "=========================================\n  YOU HAVE DIED\n=========================================\n  The dungeon keeps what it takes."
variables:
- name: score
  type: int
  initial: 0
  max: 350
  score_rankings:
  - {at: 0, title: Beginner}
  - {at: 26, title: Amateur Adventurer}
  - {at: 51, title: Novice Adventurer}
  - {at: 101, title: Junior Adventurer}
  - {at: 201, title: Adventurer}
  - {at: 301, title: Master}
  - {at: 331, title: Wizard}
  - {at: 350, title: Master Adventurer}
- name: sword_glow
  type: int
  initial: 0
- name: dig_count
  type: int
  initial: 0
# --- Stufe E: Licht-Quellen (Original I-LANTERN/I-CANDLES/I-MATCH) ---
# Lampen-Batterie: 385 Züge Brenndauer ab Entzünden (LAMP-TABLE 200/100/70/15);
# pausiert im ausgeschalteten Zustand (Original DISABLE <INT I-LANTERN>).
- name: lamp_battery
  type: int
  initial: 385
# Kerzen: 75 Züge ab Entzünden (CANDLE-TABLE 40/20/10/5).
- name: candles_battery
  type: int
  initial: 75
# Streichholz: 2 Züge (I-MATCH).
- name: match_battery
  type: int
  initial: 2
# Streichhölzer im Matchbook (MATCH-COUNT 6).
- name: match_count
  type: int
  initial: 6
rooms:
- id: west-of-house
  name: West of House
  description:
    default: You are standing in an open field west of a white house, with a boarded front door. There is a small mailbox here.
    variants:
    - when:
        has_flag: won
      text: You are standing in an open field west of a white house, with a boarded front door. There is a small mailbox here. A secret path leads southwest into the forest.
  exits:
    north:
      to: north-of-house
    south:
      to: south-of-house
    ne:
      to: north-of-house
    se:
      to: south-of-house
    west:
      to: forest-1
    east:
      to: west-of-house
      blocked: true
      msg: The door is boarded and you can't remove the boards
    sw:
      to: stone-barrow
      when:
        has_flag: won
    down:
      to: stone-barrow
      when:
        has_flag: won
- id: stone-barrow
  name: 'You are standing in front of a massive barrow of stone. In the east face

    is a huge stone door which is open. You cannot see into the dark of the tomb.'
  description: 'You are standing in front of a massive barrow of stone. In the east face

    is a huge stone door which is open. You cannot see into the dark of the tomb.'
  on_enter:
  - if:
      has_flag: won
    then:
    - msg: 'As you enter the barrow, the door closes inexorably behind you. Around you it is dark, but ahead is an enormous cavern, brightly lit. Through its center runs a wide stream. Spanning the stream is a small wooden footbridge, and beyond a path leads into a dark tunnel. Above the bridge, floating in the air, is a large sign. It reads:  All ye who stand before this bridge have completed a great and perilous adventure which has tested your wit and courage. You have mastered the first part of the ZORK trilogy.'
    - game_end: victory
  exits:
    ne:
      to: west-of-house
- id: north-of-house
  name: 'You are facing the north side of a white house. There is no door here,

    and all the windows are boarded up. To the north a narrow path winds through

    the trees.'
  description: 'You are facing the north side of a white house. There is no door here,

    and all the windows are boarded up. To the north a narrow path winds through

    the trees.'
  exits:
    sw:
      to: west-of-house
    se:
      to: east-of-house
    west:
      to: west-of-house
    east:
      to: east-of-house
    north:
      to: path
    south:
      to: north-of-house
      blocked: true
      msg: The windows are all boarded
- id: south-of-house
  name: 'You are facing the south side of a white house. There is no door here,

    and all the windows are boarded.'
  description: 'You are facing the south side of a white house. There is no door here,

    and all the windows are boarded.'
  exits:
    west:
      to: west-of-house
    east:
      to: east-of-house
    ne:
      to: east-of-house
    nw:
      to: west-of-house
    south:
      to: forest-3
    north:
      to: south-of-house
      blocked: true
      msg: The windows are all boarded
- id: east-of-house
  name: Behind House
  description: Behind House
  exits:
