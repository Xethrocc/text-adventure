# --- Stufe A: Troll-Mechanik (Original: TROLL-FCN, 1actions.zil) ---
# Tod (Kampf oder gefressene Waffe) öffnet die Passagen (Original: TROLL-FLAG).
- id: troll-defeated
  on: state troll
  once: true
  when: {state: troll, is: dead}
  effects:
  - msg: The troll lies dead on the floor. All passages out of the room are open.
  - set_flag: troll-defeated
    val: 'true'
# give axe to troll: er bekommt seine Waffe zurück und kämpft wieder.
- id: troll-give-axe
  on: command give
  when:
    all:
    - var: cmd.arg2
      is: troll
    - var: cmd.arg1
      is: axe
    - actor_has: troll
      item: axe
  effects:
  - msg: The troll scratches his head in confusion, then takes the axe.
# give sword/knife to troll: 20% frisst er die Waffe und stirbt (Original: PROB 20),
# sonst wirft er sie zurück.
- id: troll-give-sword
  on: command give
  when:
    all:
    - var: cmd.arg2
      is: troll
    - var: cmd.arg1
      is: sword
    - actor_has: troll
      item: sword
  effects:
  - random:
    - - 20
      - - msg: 'The troll, who is not overly proud, graciously accepts the gift and eats it hungrily. Poor troll, he dies from an internal hemorrhage and his carcass disappears in a sinister black fog.'
        - give: sword
        - consume: sword
        - damage_npc:
            npc: troll
            amount: 999
    - - 80
      - - msg: 'The troll, who is not overly proud, graciously accepts the gift and, being for the moment sated, throws it back. Fortunately, the troll has poor control, and the sword falls to the floor. He does not look pleased.'
        - give: sword
- id: troll-give-knife
  on: command give
  when:
    all:
    - var: cmd.arg2
      is: troll
    - var: cmd.arg1
      is: knife
    - actor_has: troll
      item: knife
  effects:
  - random:
    - - 20
      - - msg: 'The troll, who is not overly proud, graciously accepts the gift and eats it hungrily. Poor troll, he dies from an internal hemorrhage and his carcass disappears in a sinister black fog.'
        - give: knife
        - consume: knife
        - damage_npc:
            npc: troll
            amount: 999
    - - 80
      - - msg: 'The troll, who is not overly proud, graciously accepts the gift and, being for the moment sated, throws it back. Fortunately, the troll has poor control, and the knife falls to the floor. He does not look pleased.'
        - give: knife
# Andere Geschenke frisst er (Abweichung: Item bleibt beim Troll, keine consume-Referenz in Regeln).
- id: troll-give-other
  on: command give
  when:
    all:
    - var: cmd.arg2
      is: troll
    - not:
        any:
        - var: cmd.arg1
          is: axe
        - var: cmd.arg1
          is: sword
        - var: cmd.arg1
          is: knife
  effects:
  - msg: 'The troll, who is not overly proud, graciously accepts the gift and, not having the most discriminating tastes, gleefully eats it.'

# --- Stufe A: Schwert-Glühen (Original: I-SWORD, 1actions.zil) ---
# Hellwach bei Troll im Raum, blau bei Troll im Nachbarraum (cellar/ew-passage/maze-1).
- id: sword-glow
  on: turn
  when: {has_item: sword}
  effects:
  - if:
      all:
      - at: player
        room: troll-room
      - not:
          state: troll
          is: dead
    then:
    - if:
        compare_var:
          name: sword_glow
          op: lt
          value: 2
      then:
      - msg: Your sword has begun to glow very brightly.
      - set_var:
          var: sword_glow
          value: 2
    else:
    - if:
        all:
        - any:
          - at: player
            room: cellar
          - at: player
            room: ew-passage
          - at: player
            room: maze-1
        - not:
            state: troll
            is: dead
      then:
      - if:
          compare_var:
            name: sword_glow
            op: ne
            value: 1
        then:
        - msg: Your sword is glowing with a faint blue glow.
        - set_var:
            var: sword_glow
            value: 1
      else:
      - if:
          compare_var:
            name: sword_glow
            op: gt
            value: 0
        then:
        - msg: Your sword is no longer glowing.
        - set_var:
            var: sword_glow
            value: 0

# --- Stufe B: Zyklop (Original: CYCLOPS-FCN, V-ODYSSEUS, 1actions.zil:1515 / gverbs.zil:943) ---
# Lunch füttern (Original: CYCLOWRATH < 0) startet einen Timer: ohne Wasser frisst er dich.
- id: cyclops-lunch
  on: command give
  when:
    all:
    - var: cmd.arg2
      is: cyclops
    - var: cmd.arg1
      is: lunch
    - has_item: lunch
    - at: player
      room: cyclops-room
    - not:
        has_flag: cyclops_flag
  effects:
  - consume: lunch
  - msg: 'The cyclops says "Mmm Mmm. I love hot peppers! But oh, could I use a drink. Perhaps I could drink the blood of that thing." From the gleam in his eye, it could be surmised that you are "that thing".'
  - condition:
      name: cyclops_thirst
      turns: 6
      end:
      - msg: 'The cyclops, tired of all of your games and trickery, grabs you firmly. As he licks his chops, he says "Mmm. Just like Mom used to make ''em." It''s nice to be appreciated.'
      - game_end: death
# Wasser (Flasche) geben: nur wenn er durstig ist (Original: CYCLOWRATH < 0), dann schläft er.
- id: cyclops-water
  on: command give
  when:
    all:
    - var: cmd.arg2
      is: cyclops
    - var: cmd.arg1
      is: bottle
    - has_item: bottle
    - at: player
      room: cyclops-room
    - not:
        has_flag: cyclops_flag
  effects:
  - if:
      has_condition: cyclops_thirst
    then:
    - msg: The cyclops takes the bottle, checks that it's open, and drinks the water. A moment later, he lets out a yawn that nearly blows you over, and then falls fast asleep (what did you put in that drink, anyway?).
    - set_flag: cyclops_flag
      val: 'true'
    - clear_condition: cyclops_thirst
    else:
    - msg: The cyclops apparently is not thirsty and refuses your generous offer.
# Andere Geschenke (Original: "is not so stupid as to eat THAT!").
- id: cyclops-give-other
  on: command give
  when:
    all:
    - var: cmd.arg2
      is: cyclops
    - not:
        any:
        - var: cmd.arg1
          is: lunch
        - var: cmd.arg1
          is: bottle
  effects:
  - msg: The cyclops is not so stupid as to eat THAT!
# ODYSSEUS rufen (Original: V-ODYSSEUS): Zyklop flieht, Ostwand wird zur Öffnung (magic).
- id: cyclops-odysseus
  on: command odysseus
  effects:
  - if:
      all:
      - at: player
        room: cyclops-room
      - not:
          has_flag: cyclops_flag
    then:
    - msg: The cyclops, hearing the name of his father's deadly nemesis, flees the room by knocking down the wall on the east of the room.
    - set_flag: magic
      val: 'true'
    - set_flag: cyclops_flag
      val: 'true'
    - clear_condition: cyclops_thirst
    - consume: cyclops
    else:
    - msg: Wasn't he a sailor?

# --- Stufe B: Exorzismus (Original: BELL-F, M-BEG-Routine im Hades-Eingang, I-XB/I-XC, 1actions.zil:343/1060-1146) ---
# Abweichung: Glocke und Kerzen fallen nicht zu Boden (kein Item-Verschieb-Effekt); Kerzen gehen aus.
- id: hades-ring-bell
  on: command ring
  when:
    all:
    - var: cmd.arg1
      is: bell
    - has_item: bell
    - at: player
      room: entrance-to-hades
    - not:
        has_flag: lld_flag
  effects:
  - msg: The bell suddenly becomes red hot and falls to the ground. The wraiths, as if paralyzed, stop their jeering and slowly turn to face you. On their ashen faces, the expression of a long-forgotten terror takes shape.
  - place: {item: bell, in: entrance-to-hades}
  - if:
      state: candles
      is: lit
    then:
    - msg: In your confusion, the candles drop to the ground (and they are out).
    - place: {item: candles, in: entrance-to-hades}
    - set_state:
        target: candles
        to: unlit
  - set_flag: exorcism_bell
    val: 'true'
  - condition:
      name: exorcism_bell
      turns: 6
      end:
      - if:
          not:
            has_flag: exorcism_xc
        then:
        - msg: The tension of this ceremony is broken, and the wraiths, amused but shaken at your clumsy attempt, resume their hideous jeering.
        - set_flag: exorcism_bell
          val: 'false'
- id: bell-ding
  on: command ring
  when:
    all:
    - var: cmd.arg1
      is: bell
    - has_item: bell
    - not:
        all:
        - at: player
          room: entrance-to-hades
        - not:
            has_flag: lld_flag
  effects:
  - msg: Ding, dong.
# Kerzen anzünden (Original: CANDLES-FCN, 1actions.zil:2343): nur mit brennendem
# Streichholz; die brennende Fackel verdampft die Kerzen. Brennt die Glocken-
# Zeremonie: Kerzen an im Hades-Eingang → XC (3 Züge). Eine Regel mit if/else (R-01).
- id: candles-light
  on: command light
  when:
    all:
    - var: cmd.arg1
      is: candles
    - has_item: candles
    - not:
        at: player
        room: gas-room
  effects:
  - if:
      any:
      - var: cmd.arg2
        is: torch
      - var: cmd.arg3
        is: torch
    then:
    - if:
        state: candles
        is: lit
      then:
      - msg: You realize, just in time, that the candles are already lighted.
      else:
      - msg: 'The heat from the torch is so intense that the candles are vaporized.'
      - consume: candles
    else:
    - if:
        state: candles
        is: burned-out
      then:
      - msg: 'Alas, there''s not much left of the candles. Certainly not enough to burn.'
      else:
      - if:
          state: candles
          is: lit
        then:
        - msg: The candles are already lit.
        else:
        - if:
            state: match
            is: lit
          then:
          - msg: The candles are lit.
          - set_state:
              target: candles
              to: lit
          - set_var:
              var: candles_battery
              value: 75
          - if:
              all:
              - at: player
                room: entrance-to-hades
              - has_flag: exorcism_bell
            then:
            - msg: The flames flicker wildly and appear to dance. The earth beneath your feet trembles, and your legs nearly buckle beneath you. The spirits cower at your unearthly power.
            - clear_condition: exorcism_bell
            - set_flag: exorcism_bell
              val: 'false'
            - set_flag: exorcism_xc
              val: 'true'
            - condition:
                name: exorcism_xc
                turns: 3
                end:
                - set_flag: exorcism_xc
                  val: 'false'
          else:
          - msg: You should say what to light them with.
# Gebet lesen (Original: EXORCISE-Zeremonie, `read book` mit XC): Geister fliehen, Hades öffnet sich.
# --- Stufe B: Dom-Seil (Original: ROPE-FUNCTION, 1actions.zil:3030) ---
- id: dome-tie-rope
  on: command tie
  when:
    all:
    - var: cmd.arg1
      is: rope
    - any:
      - var: cmd.arg2
        is: railing
      - var: cmd.arg3
        is: railing
    - has_item: rope
    - at: player
      room: dome-room
  effects:
  - if:
      has_flag: dome_flag
    then:
    - msg: The rope is already tied to it.
    else:
    - msg: The rope drops over the side and comes within ten feet of the floor.
    - set_flag: dome_flag
      val: 'true'

# --- Stufe B: Regenbogen (Original: SCEPTRE-FUNCTION, RAINBOW-FCN, 1actions.zil:2592/2634) ---
- id: rainbow-wave
  on: command wave
  when:
    all:
    - var: cmd.arg1
      is: sceptre
    - has_item: sceptre
  effects:
  - if:
      any:
      - at: player
        room: aragain-falls
      - at: player
        room: end-of-rainbow
    then:
    - if:
        has_flag: rainbow_flag
      then:
      - msg: The rainbow seems to have become somewhat run-of-the-mill.
      - set_flag: rainbow_flag
        val: 'false'
      else:
      - msg: Suddenly, the rainbow appears to become solid and, I venture, walkable (I think the giveaway was the stairs and bannister).
      - if:
          at: player
          room: end-of-rainbow
        then:
        - msg: A shimmering pot of gold appears at the end of the rainbow.
      - set_flag: rainbow_flag
        val: 'true'
    else:
    - if:
        at: player
        room: on-rainbow
      then:
      - set_flag: rainbow_flag
        val: 'false'
      - msg: The structural integrity of the rainbow is severely compromised, leaving you hanging in midair, supported only by water vapor. Bye.
      - game_end: death
      else:
      - msg: A dazzling display of color briefly emanates from the sceptre.


# --- Stufe B: Gebet im Südtempel (Original: V-PRAY, gverbs.zil:1046; ZORN1 → forest-1) ---
- id: south-temple-pray
  on: command pray
  when:
    at: player
    room: south-temple
  effects:
  - move: forest-1

# --- Stufe B: Boot als Fahrzeug (Original: IBOAT-/RBOAT-/DBOAT-FUNCTION, V-BOARD,
# V-LAUNCH, V-DISEMBARK, 1actions.zil:2652-2835) ---
# Abweichung (bewusst): `Vehicles.hs` ist ein Stop-/Routenmodell (`drive to`, `wait`) und
# kann das Boot nur zwischen Stationen teleportieren — das bricht den Einweg-Fluss
# (nur `down`) und die `land`-Wege. Darum echte Zustandsmaschine über Flags:
#   boat-inflated  = Boot ist aufgepumpt        boat-punctured = Boot hat ein Loch
#   in-boat        = Spieler sitzt im Boot      (Wasser nur damit passierbar)
# Abweichung: `land` fasst Original-`LAND`-Richtung + `V-DISEMBARK` zusammen (Aussteigen).
# Abweichung: Glocke/Stichobjekte — boarden mit einer Waffe zersticht das Boot
# (Original: RBOAT-FUNCTION `BOARD`), aber ohne Inventar-Spillover (ROB entfällt).
- id: boat-board
  on: before board
  when:
    any:
    - var: cmd.arg1
      is: boat
    - var: cmd.arg1
      is: inflatable-boat
  effects:
  - if:
      any:
      - has_item: sword
      - has_item: knife
      - has_item: rusty-knife
      - has_item: axe
      - has_item: sceptre
    then:
    - set_flag: boat-punctured
      val: 'true'
    - set_flag: boat-inflated
      val: 'false'
    - set_flag: in-boat
      val: 'false'
    - block:
        msg: 'Oops! Something sharp seems to have slipped and punctured the boat. The boat deflates to the sounds of hissing, sputtering, and cursing.'
        turn: true
    else:
    - if:
        has_flag: boat-punctured
      then:
      - block:
          msg: No chance. Some moron punctured it.
          turn: true
      else:
      - if:
          not:
            has_flag: boat-inflated
        then:
        - block:
            msg: You will have to inflate it first.
            turn: true
        else:
        - set_flag: in-boat
          val: 'true'
        - block:
            msg: 'You are now in the boat. On the bottom of the boat is a tan label, which reads: "Warning: This boat is not a life-saving device."'
            turn: true
# Flicken mit Kitt (Original: DBOAT-FUNCTION PUT/PLUG + FIX-BOAT, 1actions.zil:2652/2664).
- id: boat-repair
  on: command use
  when:
    all:
    - var: cmd.arg1
      is: putty
    - has_flag: boat-punctured
    - has_item: putty
    - not:
        var: cmd.arg2
        is: leak
  effects:
  - msg: Well done. The boat is repaired.
  - set_flag: boat-punctured
    val: 'false'
# launch: vom Land ins Wasser (Original: RBOAT-FUNCTION LAUNCH + GO-NEXT RIVER-LAUNCH).
- id: boat-launch-not-in
  on: command launch
  when:
    all:
    - not:
        has_flag: in-boat
  effects:
  - msg: You're not in the boat!
- id: boat-launch-on-water
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - any:
      - at: player
        room: river-1
      - at: player
        room: river-2
      - at: player
        room: river-3
      - at: player
        room: river-4
      - at: player
        room: river-5
      - at: player
        room: reservoir
      - at: player
        room: in-stream
  effects:
  - if:
      at: player
      room: reservoir
    then:
    - msg: You are on the reservoir, or have you forgotten?
    else:
    - if:
        at: player
        room: in-stream
      then:
      - msg: You are on the stream, or have you forgotten?
      else:
      - msg: You are on the river, or have you forgotten?
- id: boat-launch-dam-base
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: dam-base
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-1
- id: boat-launch-white-cliffs-north
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: white-cliffs-north
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-3
- id: boat-launch-white-cliffs-south
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: white-cliffs-south
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-4
- id: boat-launch-sandy-beach
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: sandy-beach
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-4
- id: boat-launch-shore
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: shore
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-5
- id: boat-launch-here
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - not:
        any:
        - at: player
          room: river-1
        - at: player
          room: river-2
        - at: player
          room: river-3
        - at: player
          room: river-4
        - at: player
          room: river-5
        - at: player
          room: reservoir
        - at: player
          room: in-stream
        - at: player
          room: dam-base
        - at: player
          room: white-cliffs-north
        - at: player
          room: white-cliffs-south
        - at: player
          room: sandy-beach
        - at: player
          room: shore
  effects:
