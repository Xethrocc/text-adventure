    - set_state: egg
      to: broken
    - set_state: canary
      to: broken
    throw,open:
    - msg: The egg is already open.
    throw,broken:
    - msg: The egg is already broken.
- id: canary
  name: golden clockwork canary
  tags: [schatz]
  state: intact
  description:
    default: "There is a golden clockwork canary nestled in the egg. It has ruby eyes and a silver beak. Through a crystal window below its left wing you can see intricate machinery inside. It appears to have wound down."
    variants:
    - when:
        state: canary
        is: broken
      text: "There is a golden clockwork canary here. It seems to have recently had a bad experience. The mountings for its jewel-like eyes are empty, and its silver beak is crumpled. Through a cracked crystal window below its left wing you can see the remains of intricate machinery. It is not clear what result winding it would have, as the mainspring seems sprung."
  keys:
  - canary
  in_container: egg
  portable: true
  verb_map:
    before:take:
    - if:
        state: egg
        is: intact
      then:
      - block: The egg is closed. You will have to open it first.
    wind,broken:
    - msg: There is an unpleasant grinding noise from inside the canary.
    wind,intact:
    - if:
        has_flag: sing-song
      then:
      - msg: The canary chirps blithely, if somewhat tinnily, for a short time.
      else:
      - if:
          any:
          - at: player
            room: forest-1
          - at: player
            room: forest-2
          - at: player
            room: forest-3
          - at: player
            room: path
          - at: player
            room: up-a-tree
        then:
        - msg: 'The canary chirps, slightly off-key, an aria from a forgotten opera. From out of the greenery flies a lovely songbird. It perches on a limb just over your head and opens its beak to sing. As it does so a beautiful brass bauble drops from its mouth, bounces off the top of your head, and lands glimmering in the grass. As the canary winds down, the songbird flies away.'
        - set_flag: sing-song
          val: 'true'
        - give: bauble
        else:
        - msg: The canary chirps blithely, if somewhat tinnily, for a short time.
