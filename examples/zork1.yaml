    variants:
    - when:
        state: egg
        is: open
      text: The jewel-encrusted egg is open. Inside it nestles a golden clockwork canary.
    - when:
        state: egg
        is: broken
      text: There is a somewhat ruined egg here.
  keys:
  - egg
  in_container: nest
  portable: true
  capacity: 6
  verb_map:
    throw,intact:
    - msg: 'Your rather indelicate handling of the egg has caused it some damage, although you have succeeded in opening it. There is a golden clockwork canary nestled in the egg. It seems to have recently had a bad experience. The mountings for its jewel-like eyes are empty, and its silver beak is crumpled. Through a cracked crystal window below its left wing you can see the remains of intricate machinery.'
    - set_state: egg
      to: broken
    - set_state: canary
      to: broken
    throw,open:
    - msg: The egg is already open.
    throw,broken:
    - msg: The egg is already broken.
- id: canary
  name: golden clockwork canary
  tags: [schatz]
  state: intact
  description:
    default: "There is a golden clockwork canary nestled in the egg. It has ruby eyes and a silver beak. Through a crystal window below its left wing you can see intricate machinery inside. It appears to have wound down."
    variants:
    - when:
        state: canary
        is: broken
      text: "There is a golden clockwork canary here. It seems to have recently had a bad experience. The mountings for its jewel-like eyes are empty, and its silver beak is crumpled. Through a cracked crystal window below its left wing you can see the remains of intricate machinery. It is not clear what result winding it would have, as the mainspring seems sprung."
  keys:
  - canary
  in_container: egg
  portable: true
  verb_map:
    before:take:
    - if:
        state: egg
        is: intact
      then:
      - block: The egg is closed. You will have to open it first.
    wind,broken:
    - msg: There is an unpleasant grinding noise from inside the canary.
    wind,intact:
    - if:
        has_flag: sing-song
      then:
      - msg: The canary chirps blithely, if somewhat tinnily, for a short time.
      else:
      - if:
          any:
          - at: player
            room: forest-1
          - at: player
            room: forest-2
          - at: player
            room: forest-3
          - at: player
            room: path
          - at: player
            room: up-a-tree
        then:
        - msg: 'The canary chirps, slightly off-key, an aria from a forgotten opera. From out of the greenery flies a lovely songbird. It perches on a limb just over your head and opens its beak to sing. As it does so a beautiful brass bauble drops from its mouth, bounces off the top of your head, and lands glimmering in the grass. As the canary winds down, the songbird flies away.'
        - set_flag: sing-song
          val: 'true'
        - give: bauble
        else:
        - msg: The canary chirps blithely, if somewhat tinnily, for a short time.
- id: grating
  name: grating
  description: A heavy iron grating blocks the way down into the darkness.
  keys:
  - grating
  - grate
  location: grating-clearing
  verb_map:
    unlock:
    - msg: You use the skeleton key and the grating clicks open.
    - set_flag: grate-unlocked
      val: 'true'
    open:
    - if:
        has_flag: grate-unlocked
      then:
      - msg: You push the grating up. It slides aside with a screech of metal on stone.
      - set_flag: grate-open
        val: 'true'
      else:
      - msg: The grating is locked. You need the skeleton key.
- id: window
  name: kitchen window
  description: A small window which is slightly ajar, but not enough to allow entry.
  keys:
  - window
  state: closed
  location: east-of-house
  verb_map:
    instead:open,closed:
    - if:
        has_flag: kitchen-window-open
      then:
      - msg: The window is already open.
      else:
      - msg: With great effort, you open the window far enough to allow entry to the kitchen.
      - set_state:
          target: window
          to: open
      - set_flag: kitchen-window-open
        val: 'true'
    instead:open,open:
    - msg: The window is already open.
- id: diamond
  name: huge diamond
  tags: [schatz]
  description: There is an enormous diamond (perfectly cut) here.
  keys:
  - diamond
  location: nowhere
  portable: true
- id: bauble
