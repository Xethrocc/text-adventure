            to: attic
      - - 1
        - - move_npc: thief
            to: studio
      - - 1
        - - move_npc: thief
            to: gallery
      - - 1
        - - move_npc: thief
            to: machine-room
      - - 1
        - - move_npc: thief
            to: loud-room
      - - 1
