name: 'Zork I: The Great Underground Empire'
start_room: west-of-house
player:
  max_hp: 30
  attack: 10
  defense: 3
end_art:
  victory: "=========================================\n  YOU WIN\n=========================================\n  You have conquered the Great Underground Empire."
  death: "=========================================\n  YOU HAVE DIED\n=========================================\n  The dungeon keeps what it takes."
# --- Stufe F: Originale Meldungen (V-OPEN/V-CLOSE/V-TAKE/V-DROP, gverbs.zil) ---
# Die Engine-Stimme wird pro Abenteuer auf die Original-Antworten gestellt
# (messages:-Override, Phase 4.3).
messages:
  container.opened: Opened.
  container.closed: Closed.
  container.already_open: It is already open.
  container.already_closed: It is already closed.
  take.ok: Taken.
  take.already: You already have that.
  take.not_portable: A valiant attempt.
  drop.ok: Dropped.
  target.not_seen: You can't see any such thing.
  move.no_exit: You can't go that way.
  parse.unknown: I couldn't understand that sentence.
variables:
- name: score
  type: int
  initial: 0
  max: 350
  score_rankings:
  - {at: 0, title: Beginner}
  - {at: 26, title: Amateur Adventurer}
  - {at: 51, title: Novice Adventurer}
  - {at: 101, title: Junior Adventurer}
  - {at: 201, title: Adventurer}
  - {at: 301, title: Master}
  - {at: 331, title: Wizard}
  - {at: 350, title: Master Adventurer}
- name: sword_glow
  type: int
  initial: 0
- name: dig_count
  type: int
  initial: 0
# --- Stufe E: Licht-Quellen (Original I-LANTERN/I-CANDLES/I-MATCH) ---
# Lampen-Batterie: 385 Züge Brenndauer ab Entzünden (LAMP-TABLE 200/100/70/15);
# pausiert im ausgeschalteten Zustand (Original DISABLE <INT I-LANTERN>).
- name: lamp_battery
  type: int
  initial: 385
# Kerzen: 75 Züge ab Entzünden (CANDLE-TABLE 40/20/10/5).
- name: candles_battery
  type: int
  initial: 75
# Streichholz: 2 Züge (I-MATCH).
- name: match_battery
  type: int
  initial: 2
# Streichhölzer im Matchbook (MATCH-COUNT 6).
- name: match_count
  type: int
  initial: 6
rooms:
- id: west-of-house
  name: West of House
  description:
    default: >-
      You are standing in an open field west of a white house, with a
      boarded front door.
    variants:
    - when:
        has_flag: won
      text: >-
        You are standing in an open field west of a white house, with a
        boarded front door. A secret path leads southwest into the
        forest.
  exits:
    north:
      to: north-of-house
    south:
      to: south-of-house
    ne:
      to: north-of-house
    se:
      to: south-of-house
    west:
      to: forest-1
    east:
      to: west-of-house
      blocked: true
      msg: The door is boarded and you can't remove the boards
    sw:
      to: stone-barrow
      when:
        has_flag: won
    down:
      to: stone-barrow
      when:
        has_flag: won
- id: stone-barrow
  name: Stone Barrow
  description: >-
    You are standing in front of a massive barrow of stone. In the
    east face is a huge stone door which is open. You cannot see
    into the dark of the tomb.
  on_enter:
  - if:
      has_flag: won
    then:
    - msg: 'As you enter the barrow, the door closes inexorably behind you. Around you it is dark, but ahead is an enormous cavern, brightly lit. Through its center runs a wide stream. Spanning the stream is a small wooden footbridge, and beyond a path leads into a dark tunnel. Above the bridge, floating in the air, is a large sign. It reads:  All ye who stand before this bridge have completed a great and perilous adventure which has tested your wit and courage. You have mastered the first part of the ZORK trilogy.'
    - game_end: victory
  exits:
    ne:
      to: west-of-house
- id: north-of-house
  name: North of House
  description: >-
    You are facing the north side of a white house. There is no door
    here, and all the windows are boarded up. To the north a narrow
    path winds through the trees.
  exits:
    sw:
      to: west-of-house
    se:
      to: east-of-house
    west:
      to: west-of-house
    east:
      to: east-of-house
    north:
      to: path
    south:
      to: north-of-house
      blocked: true
      msg: The windows are all boarded
- id: south-of-house
  name: South of House
  description: >-
    You are facing the south side of a white house. There is no door
    here, and all the windows are boarded.
  exits:
    west:
      to: west-of-house
    east:
      to: east-of-house
    ne:
      to: east-of-house
    nw:
      to: west-of-house
    south:
      to: forest-3
    north:
      to: south-of-house
      blocked: true
      msg: The windows are all boarded
- id: east-of-house
  name: Behind House
  description:
    default: >-
      You are behind the white house. A path leads into the forest to
      the east. In one corner of the house there is a small window
      which is slightly ajar.
    variants:
    - when:
        has_flag: kitchen-window-open
      text: >-
        You are behind the white house. A path leads into the forest to
        the east. In one corner of the house there is a small window
        which is open.
  exits:
    north:
      to: north-of-house
    south:
      to: south-of-house
    sw:
      to: south-of-house
    nw:
      to: north-of-house
    east:
      to: clearing
    west:
      to: kitchen
      when:
        has_flag: kitchen-window-open
    down:
      to: kitchen
      when:
        has_flag: kitchen-window-open
- id: forest-1
  name: Forest
  description: >-
    This is a forest, with trees in all directions. To the east,
    there appears to be sunlight.
  exits:
    up:
      to: forest-1
      blocked: true
      msg: There is no tree here suitable for climbing
    north:
      to: grating-clearing
    east:
      to: path
    south:
      to: forest-3
    west:
      to: forest-1
      blocked: true
      msg: You would need a machete to go further west
- id: forest-2
  name: Forest
  description: This is a dimly lit forest, with large trees all around.
  exits:
    up:
      to: forest-2
      blocked: true
      msg: There is no tree here suitable for climbing
    north:
      to: forest-2
      blocked: true
      msg: The forest becomes impenetrable to the north
    east:
      to: mountains
    south:
      to: clearing
    west:
      to: path
- id: mountains
  name: Forest
  description: The forest thins out, revealing impassable mountains.
  exits:
    up:
      to: mountains
      blocked: true
      msg: The mountains are impassable
    north:
      to: forest-2
    east:
      to: mountains
      blocked: true
      msg: The mountains are impassable
    south:
      to: forest-2
    west:
      to: forest-2
- id: forest-3
  name: Forest
  description: This is a dimly lit forest, with large trees all around.
  exits:
    up:
      to: forest-3
      blocked: true
      msg: There is no tree here suitable for climbing
    north:
      to: clearing
    east:
      to: forest-3
      blocked: true
      msg: The rank undergrowth prevents eastward movement
    south:
      to: forest-3
      blocked: true
      msg: Storm-tossed trees block your way
    west:
      to: forest-1
    nw:
      to: south-of-house
- id: path
  name: Forest Path
  description: >-
    This is a path winding through a dimly lit forest. The path
    heads north-south here. One particularly large tree with some
    low branches stands at the edge of the path.
  exits:
    up:
      to: up-a-tree
    north:
      to: grating-clearing
    east:
      to: forest-2
    south:
      to: north-of-house
    west:
      to: forest-1
- id: up-a-tree
  name: Up a Tree
  description: >-
    You are about 10 feet above the ground nestled among some large
    branches. The nearest branch above you is above your reach.
  exits:
    down:
      to: path
    up:
      to: up-a-tree
      blocked: true
      msg: You cannot climb any higher
- id: grating-clearing
  name: Clearing
  description:
    default: >-
      You are in a clearing, with a forest surrounding you on all
      sides. A path leads south.
    variants:
    - when:
        has_flag: grate-open
      text: >-
        You are in a clearing, with a forest surrounding you on all
        sides. A path leads south. There is an open grating, descending
        into darkness.
    - when:
        has_flag: grate-unlocked
      text: >-
        You are in a clearing, with a forest surrounding you on all
        sides. A path leads south. There is a grating securely fastened
        into the ground.
  exits:
    north:
      to: grating-clearing
      blocked: true
      msg: The forest becomes impenetrable to the north
    east:
      to: forest-2
    west:
      to: forest-1
    south:
      to: path
    down:
      to: grating-room
      when:
        has_flag: grate-open
- id: clearing
  name: Clearing
  description: >-
    You are in a small clearing in a well marked forest path that
    extends to the east and west.
  exits:
    up:
      to: clearing
      blocked: true
      msg: There is no tree here suitable for climbing
    east:
      to: canyon-view
    north:
      to: forest-2
    south:
      to: forest-3
    west:
      to: east-of-house
- id: kitchen
  name: Kitchen
  description:
    default: >-
      You are in the kitchen of the white house. A table seems to have
      been used recently for the preparation of food. A passage leads
      to the west and a dark staircase can be seen leading upward. A
      dark chimney leads down and to the east is a small window which
      is slightly ajar.
    variants:
    - when:
        has_flag: kitchen-window-open
      text: >-
        You are in the kitchen of the white house. A table seems to have
        been used recently for the preparation of food. A passage leads
        to the west and a dark staircase can be seen leading upward. A
        dark chimney leads down and to the east is a small window which
        is open.
  exits:
    east:
      to: east-of-house
      when:
        has_flag: kitchen-window-open
    west:
      to: living-room
    up:
      to: attic
    down:
      to: studio
      blocked: true
      msg: Only Santa Claus climbs down chimneys.
- id: attic
  name: Attic
  description: This is the attic. The only exit is a stairway leading down.
  exits:
    down:
      to: kitchen
  tags:
  - dark
- id: living-room
  name: Living Room
  description:
    default: >-
      You are in the living room. There is a doorway to the east, a
      wooden door with strange gothic lettering to the west, which
      appears to be nailed shut, a trophy case, and a large oriental
      rug in the center of the room.
    variants:
    - when:
        all:
        - has_flag: magic
        - has_flag: rug-moved
        - has_flag: trap-door-open
      text: >-
        You are in the living room. There is a doorway to the east. To
        the west is a cyclops-shaped opening in an old wooden door,
        above which is some strange gothic lettering, a trophy case, and
        a rug lying beside an open trap door.
    - when:
        all:
        - has_flag: magic
        - has_flag: rug-moved
      text: >-
        You are in the living room. There is a doorway to the east. To
        the west is a cyclops-shaped opening in an old wooden door,
        above which is some strange gothic lettering, a trophy case, and
        a closed trap door at your feet.
    - when:
        all:
        - has_flag: magic
        - has_flag: trap-door-open
      text: >-
        You are in the living room. There is a doorway to the east. To
        the west is a cyclops-shaped opening in an old wooden door,
        above which is some strange gothic lettering, a trophy case, and
        an open trap door at your feet.
    - when:
        has_flag: magic
      text: >-
        You are in the living room. There is a doorway to the east. To
        the west is a cyclops-shaped opening in an old wooden door,
        above which is some strange gothic lettering, a trophy case, and
        a large oriental rug in the center of the room.
    - when:
        all:
        - not:
            has_flag: magic
        - has_flag: rug-moved
        - has_flag: trap-door-open
      text: >-
        You are in the living room. There is a doorway to the east, a
        wooden door with strange gothic lettering to the west, which
        appears to be nailed shut, a trophy case, and a rug lying beside
        an open trap door.
    - when:
        all:
        - not:
            has_flag: magic
        - has_flag: rug-moved
      text: >-
        You are in the living room. There is a doorway to the east, a
        wooden door with strange gothic lettering to the west, which
        appears to be nailed shut, a trophy case, and a closed trap door
        at your feet.
    - when:
        all:
        - not:
            has_flag: magic
        - has_flag: trap-door-open
      text: >-
        You are in the living room. There is a doorway to the east, a
        wooden door with strange gothic lettering to the west, which
        appears to be nailed shut, a trophy case, and an open trap door
        at your feet.
    - when:
        not:
          has_flag: magic
      text: >-
        You are in the living room. There is a doorway to the east, a
        wooden door with strange gothic lettering to the west, which
        appears to be nailed shut, a trophy case, and a large oriental
        rug in the center of the room.
  exits:
    east:
      to: kitchen
    west:
      to: strange-passage
      when:
        has_flag: magic
      msg: The door is nailed shut.
    down:
      to: cellar
      when:
        has_flag: trap-door-open
      msg: You can't go that way.
- id: cellar
  name: Cellar
  description: >-
    You are in a dark and damp cellar with a narrow passageway
    leading north, and a crawlway to the south. On the west is the
    bottom of a steep metal ramp which is unclimbable.
  exits:
    north:
      to: troll-room
    south:
      to: east-of-chasm
    up:
      to: living-room
      when:
        has_flag: trap-door-open
    west:
      to: cellar
      blocked: true
      msg: You try to ascend the ramp, but it is impossible, and you slide back down
  tags:
  - dark
- id: troll-room
  name: The Troll Room
  description: >-
    This is a small room with passages to the east and south and a
    forbidding hole leading west. Bloodstains and deep scratches
    (perhaps made by an axe) mar the walls.
  exits:
    south:
      to: cellar
    east:
      to: ew-passage
      when:
        has_flag: troll-defeated
      msg: The troll fends you off with a menacing gesture.
    west:
      to: maze-1
      when:
        has_flag: troll-defeated
      msg: The troll fends you off with a menacing gesture.
  tags:
  - dark
- id: east-of-chasm
  name: East of Chasm
  description: >-
    You are on the east edge of a chasm, the bottom of which cannot
    be seen. A narrow passage goes north, and the path you are on
    continues to the east.
  exits:
    north:
      to: cellar
    east:
      to: gallery
    down:
      to: east-of-chasm
      blocked: true
      msg: The chasm probably leads straight to the infernal regions
  tags:
  - dark
- id: gallery
  name: Gallery
  description: >-
    This is an art gallery. Most of the paintings have been stolen
    by vandals with exceptional taste. The vandals left through
    either the north or west exits.
  exits:
    west:
      to: east-of-chasm
    north:
      to: studio
- id: studio
  name: Studio
  description: >-
    This appears to have been an artist's studio. The walls and
    floors are splattered with paints of 69 different colors.
    Strangely enough, nothing of value is hanging here. At the south
    end of the room is an open door (also covered with paint). A
    dark and narrow chimney leads up from a fireplace; although you
    might be able to get up it, it seems unlikely you could get back
    down.
  exits:
    south:
      to: gallery
    up:
      to: kitchen
      when:
        all:
        - has_item: lamp
        - compare_var:
            name: count.items.by.player
            op: lte
            value: 2
      msg: You can't get up there with what you're carrying.
  tags:
  - dark
