# --- Stufe B: Boot als Fahrzeug (Original: IBOAT-/RBOAT-/DBOAT-FUNCTION, V-BOARD,
# V-LAUNCH, V-DISEMBARK, 1actions.zil:2652-2835) ---
# Abweichung (bewusst): `Vehicles.hs` ist ein Stop-/Routenmodell (`drive to`, `wait`) und
# kann das Boot nur zwischen Stationen teleportieren — das bricht den Einweg-Fluss
# (nur `down`) und die `land`-Wege. Darum echte Zustandsmaschine über Flags:
#   boat-inflated  = Boot ist aufgepumpt        boat-punctured = Boot hat ein Loch
#   in-boat        = Spieler sitzt im Boot      (Wasser nur damit passierbar)
# Abweichung: `land` fasst Original-`LAND`-Richtung + `V-DISEMBARK` zusammen (Aussteigen).
# Abweichung: Glocke/Stichobjekte — boarden mit einer Waffe zersticht das Boot
# (Original: RBOAT-FUNCTION `BOARD`), aber ohne Inventar-Spillover (ROB entfällt).
- id: boat-board
  on: before board
  when:
    any:
    - var: cmd.arg1
      is: boat
    - var: cmd.arg1
      is: inflatable-boat
  effects:
  - if:
      any:
      - has_item: sword
      - has_item: knife
      - has_item: rusty-knife
      - has_item: axe
      - has_item: sceptre
    then:
    - set_flag: boat-punctured
      val: 'true'
    - set_flag: boat-inflated
      val: 'false'
    - set_flag: in-boat
      val: 'false'
    - block:
        msg: 'Oops! Something sharp seems to have slipped and punctured the boat. The boat deflates to the sounds of hissing, sputtering, and cursing.'
        turn: true
    else:
    - if:
        has_flag: boat-punctured
      then:
      - block:
          msg: No chance. Some moron punctured it.
          turn: true
      else:
      - if:
          not:
            has_flag: boat-inflated
        then:
        - block:
            msg: You will have to inflate it first.
            turn: true
        else:
        - set_flag: in-boat
          val: 'true'
        - block:
            msg: 'You are now in the boat. On the bottom of the boat is a tan label, which reads: "Warning: This boat is not a life-saving device."'
            turn: true
# Flicken mit Kitt (Original: DBOAT-FUNCTION PUT/PLUG + FIX-BOAT, 1actions.zil:2652/2664).
- id: boat-repair
  on: command use
  when:
    all:
    - var: cmd.arg1
      is: putty
    - has_flag: boat-punctured
    - has_item: putty
    - not:
        var: cmd.arg2
        is: leak
  effects:
  - msg: Well done. The boat is repaired.
  - set_flag: boat-punctured
    val: 'false'
# launch: vom Land ins Wasser (Original: RBOAT-FUNCTION LAUNCH + GO-NEXT RIVER-LAUNCH).
- id: boat-launch-not-in
  on: command launch
  when:
    all:
    - not:
        has_flag: in-boat
  effects:
  - msg: You're not in the boat!
- id: boat-launch-on-water
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - any:
      - at: player
        room: river-1
      - at: player
        room: river-2
      - at: player
        room: river-3
      - at: player
        room: river-4
      - at: player
        room: river-5
      - at: player
        room: reservoir
      - at: player
        room: in-stream
  effects:
  - if:
      at: player
      room: reservoir
    then:
    - msg: You are on the reservoir, or have you forgotten?
    else:
    - if:
        at: player
        room: in-stream
      then:
      - msg: You are on the stream, or have you forgotten?
      else:
      - msg: You are on the river, or have you forgotten?
- id: boat-launch-dam-base
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: dam-base
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-1
- id: boat-launch-white-cliffs-north
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: white-cliffs-north
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-3
- id: boat-launch-white-cliffs-south
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: white-cliffs-south
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-4
- id: boat-launch-sandy-beach
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: sandy-beach
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-4
- id: boat-launch-shore
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - at: player
      room: shore
  effects:
  - msg: The boat slips into the water and the current takes hold.
  - move: river-5
- id: boat-launch-here
  on: command launch
  when:
    all:
    - has_flag: in-boat
    - not:
        any:
        - at: player
          room: river-1
        - at: player
          room: river-2
        - at: player
          room: river-3
        - at: player
          room: river-4
        - at: player
          room: river-5
        - at: player
          room: reservoir
        - at: player
          room: in-stream
        - at: player
          room: dam-base
        - at: player
          room: white-cliffs-north
        - at: player
          room: white-cliffs-south
        - at: player
          room: sandy-beach
        - at: player
          room: shore
  effects:
  - msg: You can't launch it here.

# --- Stufe B: land (Original: `LAND`-Richtung der Fluss-Räume, 1dungeon.zil RIVER-1..5) ---
# Achtung (Engine-Semantik!): Regeln feuern in Definitionsreihenfolge gegen den
# *jeweils schon veraenderten* Zustand — deshalb eine Regel mit if/else statt
# mehrerer sich gegenseitig nachziehender Regeln (die Fallback-Zweigregel wuerde
# nach dem `move:` erneut zutreffen).
- id: land
  on: command land
  effects:
  - if:
      at: player
      room: river-1
    then:
    - msg: You steer the boat to the landing on the west shore and climb out onto dry land.
    - move: dam-base
    - set_flag: in-boat
      val: 'false'
    else:
    - if:
        at: player
        room: river-2
      then:
      - msg: There is no safe landing spot here.
      else:
      - if:
          at: player
          room: river-3
        then:
        - msg: You steer the boat to the narrow beach below the cliffs and climb out onto dry land.
        - move: white-cliffs-north
        - set_flag: in-boat
          val: 'false'
        else:
        - if:
            at: player
            room: river-4
          then:
          - msg: You can land either to the east or the west.
          else:
          - if:
              at: player
              room: river-5
            then:
            - msg: You steer the boat to the large landing area on the east shore and climb out onto dry land.
            - move: shore
            - set_flag: in-boat
              val: 'false'
            else:
            - if:
                at: player
                room: reservoir
              then:
              - msg: You can land either to the north or the south.
              else:
              - if:
                  at: player
                  room: in-stream
                then:
                - msg: You steer the boat to the narrow beach and climb out onto dry land.
                - move: stream-view
                - set_flag: in-boat
                  val: 'false'
                else:
                - msg: You can't land here.

# --- Stufe F: in/out (Original: IN/OUT-Richtungen, 1dungeon.zil) ---
# Eine Regel mit if/else pro Befehl (R-01); `move:` zeigt den Zielraum (FIX-07).
# Die ausgelagerten up/down-Aliasse (west-of-house `down` etc.) bleiben als
# Komfort erhalten — die Original-Befehle `in`/`out` sind hier die treue Form.
- id: cmd-in
  on: command in
  effects:
  - if:
      at: player
      room: west-of-house
    then:
    - if:
        has_flag: won
      then:
      - move: stone-barrow
      else:
      - msg: You can't go that way.
    else:
    - if:
        at: player
        room: east-of-house
      then:
      - if:
          has_flag: kitchen-window-open
        then:
        - move: kitchen
        else:
        - msg: You can't go that way.
      else:
      - if:
          at: player
          room: strange-passage
        then:
        - move: cyclops-room
        else:
        - if:
            at: player
            room: entrance-to-hades
          then:
          - if:
              has_flag: lld_flag
            then:
            - move: land-of-living-dead
            else:
            - msg: Some invisible force prevents you from passing through the gate.
          else:
          - if:
              at: player
              room: mine-entrance
            then:
            - move: squeeky-room
            else:
            - msg: You can't go that way.
- id: cmd-out
  on: command out
  effects:
  - if:
      at: player
      room: kitchen
    then:
    - if:
        has_flag: kitchen-window-open
      then:
      - move: east-of-house
      else:
      - msg: You can't go that way.
    else:
    - if:
        at: player
        room: north-temple
      then:
      - move: torch-room
      else:
      - if:
          at: player
          room: land-of-living-dead
        then:
        - move: entrance-to-hades
        else:
        - if:
            at: player
            room: lower-shaft
          then:
          - if:
              compare_var:
                name: count.items.by.player
                op: lte
                value: 2
            then:
            - move: timber-room
            else:
            - msg: You cannot fit through this passage with that load.
          else:
          - msg: You can't go that way.

# --- Stufe B: Entlüften (Original: V-DEFLATE/RBOAT-FUNCTION DEFLATE, 1actions.zil:2803) ---
- id: boat-deflate-in-boat
  on: command deflate
  when:
    all:
    - has_flag: in-boat
  effects:
  - msg: You can't deflate the boat while you're in it.
- id: boat-deflate
  on: command deflate
  when:
    all:
    - has_flag: boat-inflated
    - not:
        has_flag: in-boat
  effects:
  - msg: The boat deflates.
  - set_flag: boat-inflated
    val: 'false'
  - set_flag: deflate
    val: 'true'

# --- Stufe C: Ei (Original: EGG-OBJECT / BAD-EGG, 1actions.zil:2919) ---
# `on: before open`, damit `open egg with <werkzeug>` (cmd.arg3) und die Standard-
# Meldung des Container-`open` nicht doppelt erscheinen.
- id: egg-open
  on: before open
  when:
    any:
    - var: cmd.arg1
      is: egg
    - var: cmd.arg1
      is: jewel-encrusted
  effects:
  - if:
      any:
      - state: egg
        is: broken
      - state: egg
        is: open
    then:
    - block:
        msg: The egg is already open.
    else:
    - if:
        compare_var:
          name: cmd.count
          op: lte
          value: 1
      then:
      - block:
          msg: You have neither the tools nor the expertise.
      else:
      - if:
          any:
          - var: cmd.arg2
            is: hands
          - var: cmd.arg3
            is: hands
        then:
        - block:
            msg: I doubt you could do that without damaging it.
        else:
        - if:
            any:
            - var: cmd.arg3
              is: knife
            - var: cmd.arg3
              is: sword
            - var: cmd.arg3
              is: axe
            - var: cmd.arg3
              is: rusty-knife
            - var: cmd.arg3
              is: sceptre
            - var: cmd.arg3
              is: shovel
            - var: cmd.arg3
              is: screwdriver
          then:
          - set_state: egg
            to: broken
          - set_state: canary
            to: broken
          - block:
              msg: 'The egg is now open, but the clumsiness of your attempt has seriously compromised its esthetic appeal. There is a golden clockwork canary nestled in the egg. It seems to have recently had a bad experience. The mountings for its jewel-like eyes are empty, and its silver beak is crumpled. Through a cracked crystal window below its left wing you can see the remains of intricate machinery.'
          else:
          - if:
              has_flag: egg-original
            then:
            - block:
                msg: Not to say that using the {cmd.arg3} isn't original too...
            else:
            - set_flag: egg-original
              val: 'true'
            - block:
                msg: The concept of using a {cmd.arg3} is certainly original.

# --- Stufe C: Maschinen-Deckel (Original: MACHINE-F, 1actions.zil:2502) ---
- id: machine-lid
  on: before open
  when:
    var: cmd.arg1
    is: machine
  effects:
  - if:
      has_flag: machine-open
    then:
    - block:
        msg: It already is.
    else:
    - set_flag: machine-open
      val: 'true'
    - block:
        msg: The lid opens.
- id: machine-lid-close
  on: before close
  when:
    var: cmd.arg1
    is: machine
  effects:
  - if:
      has_flag: machine-open
    then:
    - set_flag: machine-open
      val: 'false'
    - block:
        msg: The lid closes.
    else:
    - block:
        msg: It already is.

# --- Stufe C: Loud Room (Original: LOUD-ROOM-FCN, 1actions.zil:1660) ---
- id: loud-room-echo
  on: command shout
  when:
    all:
    - at: player
      room: loud-room
    - any:
      - var: cmd.arg1
        is: echo
      - var: cmd.raw_args
        is: echo
    - not:
        has_flag: loud-flag
  effects:
  - msg: The acoustics of the room change subtly.
  - set_flag: loud-flag
    val: 'true'
- id: loud-room-shout
  on: command shout
  when:
    all:
    - at: player
      room: loud-room
    - not:
        has_flag: loud-flag
  effects:
  - msg: The sound of your voice is lost in the noise.
# Wenn hinter dem Damm das Wasser laeuft, wird der Raum unertraeglich laut.
- id: loud-room-eject
  on: turn
  when:
    all:
    - at: player
      room: loud-room
    - has_flag: gates-open
    - not:
        has_flag: low_tide
    - not:
        has_flag: loud-flag
  effects:
  - msg: 'It is unbearably loud here, with an ear-splitting roar seeming to come from all around you. There is a pounding in your head which won''t stop. With a tremendous effort, you scramble out of the room.'
  - random:
    - - 1
      - - move: round-room
    - - 1
      - - move: damp-cave
    - - 1
      - - move: deep-canyon

# --- Stufe C: Sand/Skarabaeus (Original: SAND-FUNCTION, 1actions.zil:2855) ---
- id: beach-dig
  on: command dig
  when:
    all:
    - at: player
      room: sandy-cave
    - has_item: shovel
  effects:
  - add_var:
      var: dig_count
      delta: 1
  - if:
      compare_var:
        name: dig_count
        op: gt
        value: 4
    then:
    - msg: 'The hole collapses, smothering you.'
    - game_end: death
    else:
    - if:
        compare_var:
          name: dig_count
          op: eq
          value: 4
      then:
      - msg: You can see a scarab here in the sand.
      - place: {item: scarab, in: sandy-cave}
      else:
      - if:
          compare_var:
            name: dig_count
            op: eq
            value: 1
        then:
        - msg: You seem to be digging a hole here.
        else:
        - if:
            compare_var:
              name: dig_count
              op: eq
              value: 2
          then:
          - msg: The hole is getting deeper, but that's about it.
          else:
          - msg: You are surrounded by a wall of sand on all sides.
- id: beach-dig-hands
  on: command dig
  when:
    all:
    - at: player
      room: sandy-cave
    - not:
        has_item: shovel
  effects:
  - msg: Digging with your hands is slow and tedious.

# --- Stufe C: Kohlegas (Original: BOOM-ROOM, 1actions.zil:2446) ---
# Streichholz anzünden (Original: MATCH-FUNCTION, 1actions.zil:2256): verbraucht eines
# von 6 Hölzern (MATCH-COUNT), brennt 2 Züge (I-MATCH); in den windigen Räumen
# (LOWER-SHAFT, TIMBER-ROOM) pfeift es sofort aus.
- id: match-light
  on: command light
  when:
    all:
    - var: cmd.arg1
      is: match
    - has_item: match
    - not:
        at: player
        room: gas-room
  effects:
  - if:
      compare_var:
        name: match_count
        op: lte
        value: 0
    then:
    - msg: I'm afraid that you have run out of matches.
    else:
    - add_var:
        var: match_count
        delta: -1
    - if:
        any:
        - at: player
          room: lower-shaft
        - at: player
          room: timber-room
      then:
      - msg: This room is drafty, and the match goes out instantly.
      else:
      - msg: One of the matches starts to burn.
      - set_state:
          target: match
          to: lit
      - set_var:
          var: match_battery
          value: 2
- id: torch-light
  on: command light
  when:
    all:
    - var: cmd.arg1
      is: torch
    - has_item: torch
    - not:
        at: player
        room: gas-room
  effects:
  - msg: The torch is already burning.
- id: gas-boom-light
  on: command light
  when:
    at: player
    room: gas-room
  effects:
  - msg: 'How sad for an aspiring adventurer to light a {cmd.arg1} in a room which reeks of gas. Fortunately, there is justice in the world.'
  - game_end: death
- id: gas-boom-carry
  on: enter gas-room
  when:
    any:
    - state: candles
      is: lit
    - state: match
      is: lit
    - has_item: torch
  effects:
  - msg: 'Oh dear. It appears that the smell coming from this room was coal gas. I would have thought twice about carrying flaming objects in here.'
  - game_end: death

# --- Stufe C: Leck im Wartungsraum (Original: LEAK-FUNCTION / FIX-MAINT-LEAK, 1actions.zil:1362) ---
- id: maint-leak-fix
  on: command use
  when:
    all:
    - var: cmd.arg1
      is: putty
    - var: cmd.arg2
      is: leak
    - has_item: putty
    - at: player
      room: maintenance-room
    - not:
        has_flag: leak-fixed
  effects:
  - msg: By some miracle of Zorkian technology, you have managed to stop the leak in the dam.
  - set_flag: leak-fixed
    val: 'true'

# --- Stufe C: `search` soll die Raetsel nicht aushebeln (versteckte Items sind
#     im Engine-Modell per `search` findbar; hier erst nach der Mechanik) ---
- id: machine-turn
  on: before turn
  when:
    any:
    - var: cmd.arg1
      is: switch
    - var: cmd.arg1
      is: machine-switch
  effects:
  - if:
      has_flag: machine-open
    then:
    - block:
        msg: The machine doesn't seem to want to do anything.
    else:
    - if:
        any:
        - var: cmd.arg3
          is: screwdriver
        - var: cmd.arg2
          is: screwdriver
      then:
      - if:
          any:
          - in: {container: machine, item: coal}
          - has_item: coal
        then:
        - place: {item: coal, in: machine-room}
        - consume: coal
        - place: {item: diamond, in_container: machine}
        - block:
            msg: The machine comes to life (figuratively) with a dazzling display of colored lights and bizarre noises. After a few moments, the excitement abates, leaving an enormous diamond inside.
        else:
        - place: {item: diamond, in: machine-room}
        - consume: diamond
        - place: {item: gunk, in_container: machine}
        - block:
            msg: The machine comes to life (figuratively) with a dazzling display of colored lights and bizarre noises. After a few moments, the excitement abates, leaving a small piece of vitreous slag inside.
      else:
      - block:
          msg: It seems that a screwdriver won't do.

# --- Stufe C: Kohle in die Maschine (Original: <IN? ,COAL ,MACHINE>) ---
# `actor_has` prueft nur CarriedBy, nicht Container-Inhalt — darum merkt eine
# Regel das `put coal in machine`. Zusatz-Lenienz: die Kohle zu tragen genuegt.
# --- Stufe C: Kohle in die Maschine (Original: <IN? ,COAL ,MACHINE>) ---
# `actor_has` prueft nur CarriedBy, nicht Container-Inhalt — darum merkt eine
# Regel das `put coal in machine`. Zusatz-Lenienz: die Kohle zu tragen genuegt.
- id: coal-in-machine
  on: before put
  when:
    all:
    - var: cmd.arg1
      is: coal
    - any:
      - var: cmd.arg2
        is: machine
      - var: cmd.arg3
        is: machine
    - has_item: coal
  effects:
  - set_flag: coal-in-machine
    val: 'true'

# --- Stufe C: Spiegel (Original: MIRROR-MIRROR, 1actions.zil:971) ---
# `on: before rub`, weil `rub mirror with <ding>` als ein Zielstring ankommt.
- id: mirror-rub
  on: before rub
  when:
    any:
    - var: cmd.arg1
      is: mirror
    - var: cmd.arg1
      is: mirror-1
    - var: cmd.arg1
      is: mirror-2
  effects:
  - if:
      has_flag: mirror-mung
    then:
    - block:
        msg: The mirror is broken into many pieces.
    else:
    - if:
        all:
        - compare_var:
            name: cmd.count
            op: gt
            value: 1
        - not:
            var: cmd.arg3
            is: hands
        - not:
            var: cmd.arg2
            is: hands
      then:
      - block:
          msg: You feel a faint tingling transmitted through the {cmd.arg3}.
      else:
      - if:
          at: player
          room: mirror-room-1
        then:
        - move: mirror-room-2
        - block:
            msg: 'There is a rumble from deep within the earth and the room shakes.'
            turn: true
        else:
        - move: mirror-room-1
        - block:
            msg: 'There is a rumble from deep within the earth and the room shakes.'
            turn: true

# --- Stufe D: Dieb-Texte (Original: ROBBER-FUNCTION, 1actions.zil:1947) ---
- id: thief-texts
  on: before take
  when:
    var: cmd.arg1
    is: thief
  effects:
  - block:
      msg: Once you got him, what would you do with him?
- id: thief-examine
  on: before examine
  when:
    var: cmd.arg1
    is: thief
  effects:
  - block:
      msg: 'The thief is a slippery character with beady eyes that flit back and forth. He carries, along with an unmistakable arrogance, a large bag over his shoulder and a vicious stiletto, whose blade is aimed menacingly in your direction. I''d watch out if I were you.'
- id: thief-talk
  on: before talk
  when:
    var: cmd.arg1
    is: thief
  effects:
  - block:
      msg: The thief says nothing, as you have not been formally introduced.

# --- Stufe D: Dieb (Original: ROBBER-FUNCTION `1actions.zil:1947`, I-THIEF `:3890`,
#     THIEF-IN-TREASURE `:2138`, DEPOSIT-BOOTY `:1897`) ---

# Schatzkammer betreten: der Dieb eilt zur Verteidigung herbei.
- id: thief-defends-treasure-room
  on: enter treasure-room
  when:
    not:
      state: thief
      is: dead
  effects:
  - msg: 'You hear a scream of anguish as you violate the robber''s hideaway. Using passages unknown to you, he rushes to its defense.'
  - move_npc: thief
    to: treasure-room
  - set_flag: thief-fighting
    val: 'true'

# Kelch nicht nehmen, solange der Dieb dort kämpft (Original: CHALICE-FCN).
- id: chalice-guard
  on: before take
  when:
    all:
    - var: cmd.arg1
      is: chalice
    - at: player
      room: treasure-room
    - at: thief
      room: treasure-room
    - not:
        state: thief
        is: dead
  effects:
  - block:
      msg: You'd be stabbed in the back first.

# Dem Dieb etwas geben (Original: ROBBER-FUNCTION, GIVE/THROW): Schätze bewundert er.
- id: thief-give-treasure
  on: before give
  when:
    all:
    - var: cmd.arg2
      is: thief
    - not:
        state: thief
        is: dead
    - actor_has_tag:
        actor: player
        tag: schatz
  effects:
  - msg: 'The thief is taken aback by your unexpected generosity, but stops to admire its beauty.'

# Tod: Beute bleibt liegen, Stilett fällt, und die Schätze der Schatzkammer
# erscheinen wieder (Original: ROBBER-FUNCTION F-DEAD + DEPOSIT-BOOTY).
# EGG-SOLVE: hatte er das Ei dabei, ist es unversehrt geöffnet — der intakte
# Kanarienvogel wird damit erreichbar.
- id: thief-death
  on: state thief
  once: true
  when:
    state: thief
    is: dead
  effects:
  - msg: 'As the thief dies, the power of his magic decreases, and his treasures reappear.'
  - if:
      all:
      - actor_has: thief
        item: egg
      - state: egg
        is: intact
    then:
    - set_state: egg
      to: open
    - msg: The jewel-encrusted egg falls open unharmed. Inside it nestles a golden clockwork canary.
  - move_all:
      what: items
      by: thief
      to:
        by: player
  - place: {item: stiletto, in: treasure-room}
  - place: {item: large-bag, in: treasure-room}
  - set_flag: thief-fighting
    val: 'false'

# --- Stufe D: Dieb wandert (Original: I-THIEF "Move to next room, and hack",
#     1actions.zil:3890 - er zieht durch alle begehbaren, nicht-geheiligten Raeume) ---
# Abweichung: der Original-Rundkurs laeuft ueber die ganze Raumliste; hier zieht eine
# random:-Auswahl den Raum. move_npc braucht ein literales Ziel (Befunde OPEN-11).
- id: thief-wanders
  on: turn
  when:
    all:
    - not:
        state: thief
        is: dead
    - not:
        has_flag: thief-fighting
  effects:
  - random:
      stream: thief
      choices:
      - - 1
        - - move_npc: thief
            to: round-room
      - - 1
        - - move_npc: thief
            to: troll-room
      - - 1
        - - move_npc: thief
            to: cellar
      - - 1
        - - move_npc: thief
            to: living-room
      - - 1
        - - move_npc: thief
            to: kitchen
      - - 1
        - - move_npc: thief
            to: attic
      - - 1
        - - move_npc: thief
            to: studio
      - - 1
        - - move_npc: thief
            to: gallery
      - - 1
        - - move_npc: thief
            to: machine-room
      - - 1
        - - move_npc: thief
            to: loud-room
      - - 1
        - - move_npc: thief
            to: dam-room
      - - 1
        - - move_npc: thief
            to: maintenance-room
      - - 1
        - - move_npc: thief
            to: reservoir-south
      - - 1
        - - move_npc: thief
