- id: cyclops-room
  name: Cyclops Room
  description:
    default: >-
      This room has an exit on the northwest, and a staircase leading
      up. A cyclops, who looks prepared to eat horses (much less mere
      adventurers), blocks the staircase. From his state of health,
      and the bloodstains on the walls, you gather that he is not very
      friendly, though he likes people.
    variants:
    - when:
        all:
        - has_flag: cyclops_flag
        - not:
            has_flag: magic
      text: >-
        This room has an exit on the northwest, and a staircase leading
        up. The cyclops is sleeping blissfully at the foot of the
        stairs.
    - when:
        has_flag: magic
      text: >-
        This room has an exit on the northwest, and a staircase leading
        up. The east wall, previously solid, now has a cyclops-sized
        opening in it.
    - when:
        has_condition: cyclops_thirst
      text: >-
        This room has an exit on the northwest, and a staircase leading
        up. The cyclops, having eaten the hot peppers, appears to be
        gasping. His enflamed tongue protrudes from his man-sized mouth.
  exits:
    nw:
      to: maze-15
    east:
      to: strange-passage
      when:
        has_flag: magic
      msg: The east wall is solid rock.
    up:
      to: treasure-room
      when:
        has_flag: cyclops_flag
      msg: The cyclops doesn't look like he'll let you past.
  tags:
  - dark
- id: strange-passage
  name: Strange Passage
  description: >-
    This is a long passage. To the west is one entrance. On the east
    there is an old wooden door, with a large opening in it (about
    cyclops sized).
  exits:
    west:
      to: cyclops-room
    down:
      to: cyclops-room
    east:
      to: living-room
  tags:
  - dark
- id: treasure-room
  name: Treasure Room
  description: >-
    This is a large room, whose east wall is solid granite. A number
    of discarded bags, which crumble at your touch, are scattered
    about on the floor. There is an exit down a staircase.
  exits:
    down:
      to: cyclops-room
- id: reservoir-south
  name: Reservoir South
  description:
    default: >-
      You are in a long room on the south shore of a large lake, far
      too deep and wide for crossing. There is a path along the stream
      to the east or west, a steep pathway climbing southwest along
      the edge of a chasm, and a path leading into a canyon to the
      southeast.
    variants:
    - when:
        all:
        - has_flag: low_tide
        - has_flag: gates-open
      text: >-
        You are in a long room, to the north of which was formerly a
        lake. However, with the water level lowered, there is merely a
        wide stream running through the center of the room. There is a
        path along the stream to the east or west, a steep pathway
        climbing southwest along the edge of a chasm, and a path leading
        into a canyon to the southeast.
    - when:
        has_flag: gates-open
      text: >-
        You are in a long room. To the north is a large lake, too deep
        to cross. You notice, however, that the water level appears to
        be dropping at a rapid rate. Before long, it might be possible
        to cross to the other side from here. There is a path along the
        stream to the east or west, a steep pathway climbing southwest
        along the edge of a chasm, and a path leading into a canyon to
        the southeast.
    - when:
        has_flag: low_tide
      text: >-
        You are in a long room, to the north of which is a wide area
        which was formerly a reservoir, but now is merely a stream. You
        notice, however, that the level of the stream is rising quickly
        and that before long it will be impossible to cross here. There
        is a path along the stream to the east or west, a steep pathway
        climbing southwest along the edge of a chasm, and a path leading
        into a canyon to the southeast.
  exits:
    se:
      to: deep-canyon
    sw:
      to: chasm-room
    east:
      to: dam-room
    west:
      to: stream-view
    north:
      to: reservoir
      when:
        has_flag: low_tide
      msg: You would drown.
  tags:
  - dark
- id: reservoir
  name: Reservoir
  description:
    default: >-
      You are on the lake. Beaches can be seen north and south.
      Upstream a small stream enters the lake through a narrow cleft
      in the rocks. The dam can be seen downstream.
    variants:
    - when:
        has_flag: low_tide
      text: >-
        You are on what used to be a large lake, but which is now a
        large mud pile. There are "shores" to the north and south.
  exits:
    north:
      to: reservoir-north
    south:
      to: reservoir-south
    up:
      to: in-stream
    west:
      to: in-stream
    down:
      to: river-1
      when:
        all:
        - has_flag: low_tide
        - has_flag: in-boat
      msg: The sluice gates are closed. The dam blocks your way.
  tags:
  - dark
- id: reservoir-north
  name: Reservoir North
  description:
    default: >-
      You are in a large cavernous room, north of a large lake. There
      is a slimy stairway leaving the room to the north.
    variants:
    - when:
        all:
        - has_flag: low_tide
        - has_flag: gates-open
      text: >-
        You are in a large cavernous room, the south of which was
        formerly a lake. However, with the water level lowered, there is
        merely a wide stream running through there. There is a slimy
        stairway leaving the room to the north.
    - when:
        has_flag: gates-open
      text: >-
        You are in a large cavernous area. To the south is a wide lake,
        whose water level appears to be falling rapidly. There is a
        slimy stairway leaving the room to the north.
    - when:
        has_flag: low_tide
      text: >-
        You are in a cavernous area, to the south of which is a very
        wide stream. The level of the stream is rising rapidly, and it
        appears that before long it will be impossible to cross to the
        other side. There is a slimy stairway leaving the room to the
        north.
  exits:
    north:
      to: atlantis-room
    south:
      to: reservoir
      when:
        has_flag: low_tide
      msg: You would drown.
  tags:
  - dark
- id: stream-view
  name: Stream View
  description: >-
    You are standing on a path beside a gently flowing stream. The
    path follows the stream, which flows from west to east.
  exits:
    east:
      to: reservoir-south
    west:
      to: stream-view
      blocked: true
      msg: The stream emerges from a spot too small for you to enter
  tags:
  - dark
- id: in-stream
  name: Stream
  description: >-
    You are on the gently flowing stream. The upstream route is too
    narrow to navigate, and the downstream route is invisible due to
    twisting walls. There is a narrow beach to land on.
  exits:
    up:
      to: in-stream
      blocked: true
      msg: The channel is too narrow
    west:
      to: in-stream
      blocked: true
      msg: The channel is too narrow
    down:
      to: reservoir
    east:
      to: reservoir
  tags:
  - dark
- id: mirror-room-1
  name: Mirror Room
  description:
    default: >-
      You are in a large square room with tall ceilings. On the south
      wall is an enormous mirror which fills the entire wall. There
      are exits on the other three sides of the room.
    variants:
    - when:
        has_flag: mirror-mung
      text: >-
        You are in a large square room with tall ceilings. On the south
        wall is an enormous mirror which fills the entire wall. There
        are exits on the other three sides of the room. Unfortunately,
        the mirror has been destroyed by your recklessness.
  exits:
    north:
      to: cold-passage
    west:
      to: twisting-passage
    east:
      to: small-cave
  tags:
  - dark
- id: mirror-room-2
  name: Mirror Room
  description:
    default: >-
      You are in a large square room with tall ceilings. On the south
      wall is an enormous mirror which fills the entire wall. There
      are exits on the other three sides of the room.
    variants:
    - when:
        has_flag: mirror-mung
      text: >-
        You are in a large square room with tall ceilings. On the south
        wall is an enormous mirror which fills the entire wall. There
        are exits on the other three sides of the room. Unfortunately,
        the mirror has been destroyed by your recklessness.
  exits:
    west:
      to: winding-passage
    north:
      to: narrow-passage
    east:
      to: tiny-cave
- id: small-cave
  name: Cave
  description: >-
    This is a tiny cave with entrances west and north, and a
    staircase leading down.
  exits:
    north:
      to: mirror-room-1
    down:
      to: atlantis-room
    south:
      to: atlantis-room
    west:
      to: twisting-passage
  tags:
  - dark
- id: tiny-cave
  name: Cave
  description: >-
    This is a tiny cave with entrances west and north, and a dark,
    forbidding staircase leading down.
  exits:
    north:
      to: mirror-room-2
    west:
      to: winding-passage
    down:
      to: entrance-to-hades
  tags:
  - dark
- id: cold-passage
  name: Cold Passage
  description: >-
    This is a cold and damp corridor where a long east-west
    passageway turns into a southward path.
  exits:
    south:
      to: mirror-room-1
    west:
      to: slide-room
  tags:
  - dark
- id: narrow-passage
  name: Narrow Passage
  description: >-
    This is a long and narrow corridor where a long north-south
    passageway briefly narrows even further.
  exits:
    north:
      to: round-room
    south:
      to: mirror-room-2
  tags:
  - dark
- id: winding-passage
  name: Winding Passage
  description: >-
    This is a winding passage. It seems that there are only exits on
    the east and north.
  exits:
    north:
      to: mirror-room-2
    east:
      to: tiny-cave
  tags:
  - dark
- id: twisting-passage
  name: Twisting Passage
  description: >-
    This is a winding passage. It seems that there are only exits on
    the east and north.
  exits:
    north:
      to: mirror-room-1
    east:
      to: small-cave
  tags:
  - dark
- id: atlantis-room
  name: Atlantis Room
  description: >-
    This is an ancient room, long under water. There is an exit to
    the south and a staircase leading up.
  exits:
    up:
      to: small-cave
    south:
      to: reservoir-north
  tags:
  - dark
- id: ew-passage
  name: East-West Passage
  description: >-
    This is a narrow east-west passageway. There is a narrow
    stairway leading down at the north end of the room.
  exits:
    east:
      to: round-room
    west:
      to: troll-room
    down:
      to: chasm-room
    north:
      to: chasm-room
  tags:
  - dark
- id: round-room
  name: Round Room
  description: >-
    This is a circular stone room with passages in all directions.
    Several of them have unfortunately been blocked by cave-ins.
  exits:
    east:
      to: loud-room
    west:
      to: ew-passage
    north:
      to: ns-passage
    south:
      to: narrow-passage
    se:
      to: engravings-cave
  tags:
  - dark
- id: deep-canyon
  name: Deep Canyon
  description:
    default: >-
      You are on the south edge of a deep canyon. Passages lead off to
      the east, northwest and southwest. A stairway leads down. You
      can hear the sound of flowing water from below.
    variants:
    - when:
        all:
        - has_flag: gates-open
        - not:
            has_flag: low_tide
      text: >-
        You are on the south edge of a deep canyon. Passages lead off to
        the east, northwest and southwest. A stairway leads down. You
        can hear a loud roaring sound, like that of rushing water, from
        below.
    - when:
        all:
        - not:
            has_flag: gates-open
        - has_flag: low_tide
      text: >-
        You are on the south edge of a deep canyon. Passages lead off to
        the east, northwest and southwest. A stairway leads down.
  exits:
    nw:
      to: reservoir-south
    east:
      to: dam-room
    sw:
      to: ns-passage
    down:
      to: loud-room
  tags:
  - dark
- id: damp-cave
  name: Damp Cave
  description: >-
    This cave has exits to the west and east, and narrows to a crack
    toward the south. The earth is particularly damp here.
  exits:
    west:
      to: loud-room
    east:
      to: white-cliffs-north
    south:
      to: damp-cave
      blocked: true
      msg: It is too narrow for most insects
  tags:
  - dark
- id: loud-room
  name: Loud Room
  description:
    default: >-
      This is a large room with a ceiling which cannot be detected
      from the ground. There is a narrow passage from east to west and
      a stone stairway leading upward. The room is deafeningly loud
      with an undetermined rushing sound. The sound seems to
      reverberate from all of the walls, making it difficult even to
      think.
    variants:
    - when:
        any:
        - has_flag: loud-flag
        - all:
          - not:
              has_flag: gates-open
          - has_flag: low_tide
      text: >-
        This is a large room with a ceiling which cannot be detected
        from the ground. There is a narrow passage from east to west and
        a stone stairway leading upward. The room is eerie in its
        quietness.
  exits:
    east:
      to: damp-cave
    west:
      to: round-room
    up:
      to: deep-canyon
  tags:
  - dark
- id: ns-passage
  name: North-South Passage
  description: >-
    This is a high north-south passage, which forks to the
    northeast.
  exits:
    north:
      to: chasm-room
    ne:
      to: deep-canyon
    south:
      to: round-room
  tags:
  - dark
- id: chasm-room
  name: Chasm
  description: >-
    A chasm runs southwest to northeast and the path follows it. You
    are on the south side of the chasm, where a crack opens into a
    passage.
  exits:
    ne:
      to: reservoir-south
    sw:
      to: ew-passage
    up:
      to: ew-passage
    south:
      to: ns-passage
    down:
      to: chasm-room
      blocked: true
      msg: Are you out of your mind
  tags:
  - dark
- id: entrance-to-hades
  name: Entrance to Hades
  description:
    default: "You are outside a large gateway, on which is inscribed\n\n  Abandon every hope all ye who enter here!\n\nThe gate is open; through it you can see a desolation, with a pile of mangled bodies in one corner. Thousands of voices, lamenting some hideous fate, can be heard."
    variants:
    - when:
        not:
          has_flag: lld_flag
      text: "You are outside a large gateway, on which is inscribed\n\n  Abandon every hope all ye who enter here!\n\nThe gate is open; through it you can see a desolation, with a pile of mangled bodies in one corner. Thousands of voices, lamenting some hideous fate, can be heard. The way through the gate is barred by evil spirits, who jeer at your attempts to pass."
  exits:
    up:
      to: tiny-cave
    down:
      to: land-of-living-dead
      when:
        has_flag: lld_flag
      msg: Some invisible force prevents you from passing through the gate.
    south:
      to: land-of-living-dead
      when:
        has_flag: lld_flag
      msg: Some invisible force prevents you from passing through the gate.
- id: land-of-living-dead
  name: Land of the Dead
  description: >-
    You have entered the Land of the Living Dead. Thousands of lost
    souls can be heard weeping and moaning. In the corner are
    stacked the remains of dozens of previous adventurers less
    fortunate than yourself. A passage exits to the north.
  exits:
    up:
      to: entrance-to-hades
    north:
      to: entrance-to-hades
- id: engravings-cave
  name: Engravings Cave
  description: >-
    You have entered a low cave with passages leading northwest and
    east.
  exits:
    nw:
      to: round-room
    east:
      to: dome-room
  tags:
  - dark
- id: egypt-room
  name: Egyptian Room
  description: >-
    This is a room which looks like an Egyptian tomb. There is an
    ascending staircase to the west.
  exits:
    west:
      to: north-temple
    up:
      to: north-temple
  tags:
  - dark
- id: dome-room
  name: Dome Room
  description:
    default: >-
      You are at the periphery of a large dome, which forms the
      ceiling of another room below. Protecting you from a precipitous
      drop is a wooden railing which circles the dome.
    variants:
    - when:
        has_flag: dome_flag
      text: >-
        You are at the periphery of a large dome, which forms the
        ceiling of another room below. Protecting you from a precipitous
        drop is a wooden railing which circles the dome. Hanging down
        from the railing is a rope which ends about ten feet from the
        floor below.
  exits:
    west:
      to: engravings-cave
    down:
      to: torch-room
      when:
        has_flag: dome_flag
      msg: You cannot go down without fracturing many bones.
  tags:
  - dark
- id: torch-room
  name: Torch Room
  description:
    default: >-
      This is a large room with a prominent doorway leading to a down
      staircase. Above you is a large dome. Up around the edge of the
      dome (20 feet up) is a wooden railing. In the center of the room
      sits a white marble pedestal.
    variants:
    - when:
        has_flag: dome_flag
      text: >-
        This is a large room with a prominent doorway leading to a down
        staircase. Above you is a large dome. Up around the edge of the
        dome (20 feet up) is a wooden railing. In the center of the room
        sits a white marble pedestal. A piece of rope descends from the
        railing above, ending some five feet above your head.
  exits:
    up:
      to: torch-room
      blocked: true
      msg: You cannot reach the rope
    south:
      to: north-temple
    down:
      to: north-temple
  tags:
  - dark
- id: north-temple
  name: Temple
  description: >-
    This is the north end of a large temple. On the east wall is an
    ancient inscription, probably a prayer in a long-forgotten
    language. Below the prayer is a staircase leading down. The west
    wall is solid granite. The exit to the north end of the room is
    through huge marble pillars.
  exits:
    down:
      to: egypt-room
    east:
      to: egypt-room
    north:
      to: torch-room
    up:
      to: torch-room
    south:
      to: south-temple
- id: south-temple
  name: Altar
  description: >-
    This is the south end of a large temple. In front of you is what
    appears to be an altar. In one corner is a small hole in the
    floor which leads into darkness. You probably could not get back
    up it.
  exits:
    north:
      to: north-temple
    down:
      to: tiny-cave
      when:
        not:
          has_item: coffin
      msg: You haven't a prayer of getting the coffin down there.
- id: dam-room
  name: Dam
  description:
    default: >-
      You are standing on the top of the Flood Control Dam #3, which
      was quite a tourist attraction in times far distant. There are
      paths to the north, south, and west, and a scramble down. The
      sluice gates on the dam are closed. Behind the dam, there can be
      seen a wide reservoir. Water is pouring over the top of the now
      abandoned dam. There is a control panel here, on which a large
      metal bolt is mounted. Directly above the bolt is a small green
      plastic bubble.
    variants:
    - when:
        all:
        - has_flag: gate-flag
        - all:
          - has_flag: low_tide
          - has_flag: gates-open
      text: >-
        You are standing on the top of the Flood Control Dam #3, which
        was quite a tourist attraction in times far distant. There are
        paths to the north, south, and west, and a scramble down. The
        water level behind the dam is low: The sluice gates have been
        opened. Water rushes through the dam and downstream. There is a
        control panel here, on which a large metal bolt is mounted.
        Directly above the bolt is a small green plastic bubble which is
        glowing serenely.
    - when:
        all:
        - has_flag: gate-flag
        - has_flag: gates-open
      text: >-
        You are standing on the top of the Flood Control Dam #3, which
        was quite a tourist attraction in times far distant. There are
        paths to the north, south, and west, and a scramble down. The
        sluice gates are open, and water rushes through the dam. The
        water level behind the dam is still high. There is a control
        panel here, on which a large metal bolt is mounted. Directly
        above the bolt is a small green plastic bubble which is glowing
        serenely.
    - when:
        all:
        - has_flag: gate-flag
        - has_flag: low_tide
      text: >-
        You are standing on the top of the Flood Control Dam #3, which
        was quite a tourist attraction in times far distant. There are
        paths to the north, south, and west, and a scramble down. The
        sluice gates are closed. The water level in the reservoir is
        quite low, but the level is rising quickly. There is a control
        panel here, on which a large metal bolt is mounted. Directly
        above the bolt is a small green plastic bubble which is glowing
        serenely.
    - when:
        has_flag: gate-flag
      text: >-
        You are standing on the top of the Flood Control Dam #3, which
        was quite a tourist attraction in times far distant. There are
        paths to the north, south, and west, and a scramble down. The
        sluice gates on the dam are closed. Behind the dam, there can be
        seen a wide reservoir. Water is pouring over the top of the now
        abandoned dam. There is a control panel here, on which a large
        metal bolt is mounted. Directly above the bolt is a small green
        plastic bubble which is glowing serenely.
    - when:
        all:
        - has_flag: low_tide
        - has_flag: gates-open
      text: >-
        You are standing on the top of the Flood Control Dam #3, which
        was quite a tourist attraction in times far distant. There are
        paths to the north, south, and west, and a scramble down. The
        water level behind the dam is low: The sluice gates have been
        opened. Water rushes through the dam and downstream. There is a
        control panel here, on which a large metal bolt is mounted.
        Directly above the bolt is a small green plastic bubble.
    - when:
        has_flag: gates-open
      text: >-
        You are standing on the top of the Flood Control Dam #3, which
        was quite a tourist attraction in times far distant. There are
        paths to the north, south, and west, and a scramble down. The
        sluice gates are open, and water rushes through the dam. The
        water level behind the dam is still high. There is a control
        panel here, on which a large metal bolt is mounted. Directly
        above the bolt is a small green plastic bubble.
    - when:
        has_flag: low_tide
      text: >-
        You are standing on the top of the Flood Control Dam #3, which
        was quite a tourist attraction in times far distant. There are
        paths to the north, south, and west, and a scramble down. The
        sluice gates are closed. The water level in the reservoir is
        quite low, but the level is rising quickly. There is a control
        panel here, on which a large metal bolt is mounted. Directly
        above the bolt is a small green plastic bubble.
  exits:
    south:
      to: deep-canyon
    down:
      to: dam-base
    east:
      to: dam-base
    north:
      to: dam-lobby
    west:
      to: reservoir-south
- id: dam-lobby
  name: Dam Lobby
  description: >-
    This room appears to have been the waiting room for groups
    touring the dam. There are open doorways here to the north and
    east marked \"Private\", and there is a path leading south over
    the top of the dam.
  exits:
    south:
      to: dam-room
    north:
      to: maintenance-room
    east:
      to: maintenance-room
- id: maintenance-room
  name: Maintenance Room
  description: >-
    This is what appears to have been the maintenance room for Flood
    Control Dam #3. Apparently, this room has been ransacked
    recently, for most of the valuable equipment is gone. On the
    wall in front of you is a group of buttons colored blue, yellow,
    brown, and red. There are doorways to the west and south.
  exits:
    south:
      to: dam-lobby
    west:
      to: dam-lobby
  tags:
  - dark
- id: dam-base
  name: Dam Base
  description: >-
    You are at the base of Flood Control Dam #3, which looms above
    you and to the north. The river Frigid is flowing by here. Along
    the river are the White Cliffs which seem to form giant walls
    stretching from north to south along the shores of the river as
    it winds its way downstream.
  exits:
    north:
      to: dam-room
    up:
      to: dam-room
- id: river-1
  name: Frigid River
  description: >-
    You are on the Frigid River in the vicinity of the Dam. The
    river flows quietly here. There is a landing on the west shore.
  exits:
    up:
      to: river-1
      blocked: true
      msg: You cannot go upstream due to strong currents
    west:
      to: dam-base
      when:
        has_flag: in-boat
      msg: You need the boat to reach the dam base from the river.
    down:
      to: river-2
      when:
        has_flag: in-boat
      msg: The river is running too fast to enter from here.
    east:
      to: river-1
      blocked: true
      msg: The White Cliffs prevent your landing here
- id: river-2
  name: Frigid River
  description: >-
    The river turns a corner here making it impossible to see the
    Dam. The White Cliffs loom on the east bank and large rocks
    prevent landing on the west.
  exits:
    up:
      to: river-2
      blocked: true
      msg: You cannot go upstream due to strong currents
    down:
      to: river-3
      when:
        has_flag: in-boat
      msg: The river is running too fast.
    east:
      to: river-2
      blocked: true
      msg: The White Cliffs prevent your landing here
    west:
      to: river-2
      blocked: true
      msg: Just in time you steer away from the rocks
  tags:
  - dark
- id: river-3
  name: Frigid River
  description: >-
    The river descends here into a valley. There is a narrow beach
    on the west shore below the cliffs. In the distance a faint
    rumbling can be heard.
  exits:
    up:
      to: river-3
      blocked: true
      msg: You cannot go upstream due to strong currents
    down:
      to: river-4
      when:
        has_flag: in-boat
      msg: The river is running too fast.
    west:
      to: white-cliffs-north
      when:
        has_flag: in-boat
      msg: You can only land here from your boat.
  tags:
  - dark
- id: white-cliffs-north
  name: White Cliffs Beach
  description: >-
    You are on a narrow strip of beach which runs along the base of
    the White Cliffs. There is a narrow path heading south along the
    Cliffs and a tight passage leading west into the cliffs
    themselves.
  exits:
    south:
      to: white-cliffs-south
      when:
        has_flag: deflate
      msg: The path is too narrow.
    west:
      to: damp-cave
      when:
        has_flag: deflate
      msg: The path is too narrow.
  tags:
  - dark
- id: white-cliffs-south
  name: White Cliffs Beach
  description: >-
    You are on a rocky, narrow strip of beach beside the Cliffs. A
    narrow path leads north along the shore.
  exits:
    north:
      to: white-cliffs-north
      when:
        has_flag: deflate
      msg: The path is too narrow.
  tags:
  - dark
- id: river-4
  name: Frigid River
  description: >-
    The river is running faster here and the sound ahead appears to
    be that of rushing water. On the east shore is a sandy beach. A
    small area of beach can also be seen below the cliffs on the
    west shore.
  exits:
    up:
      to: river-4
      blocked: true
      msg: You cannot go upstream due to strong currents
    down:
      to: river-5
      when:
        has_flag: in-boat
      msg: The river is running too fast.
    west:
      to: white-cliffs-south
      when:
        has_flag: in-boat
      msg: You can only land here from your boat.
    east:
      to: sandy-beach
      when:
        has_flag: in-boat
      msg: You can only land here from your boat.
  tags:
  - dark
- id: river-5
  name: Frigid River
  description: >-
    The sound of rushing water is nearly unbearable here. On the
    east shore is a large landing area.
  exits:
    up:
      to: river-5
      blocked: true
      msg: You cannot go upstream due to strong currents
    east:
      to: shore
      when:
        has_flag: in-boat
      msg: You can only land here from your boat.
- id: shore
  name: Shore
  description: >-
    You are on the east shore of the river. The water here seems
    somewhat treacherous. A path travels from north to south here,
    the south end quickly turning around a sharp corner.
  exits:
    north:
      to: sandy-beach
    south:
      to: aragain-falls
- id: sandy-beach
  name: Sandy Beach
  description: >-
    You are on a large sandy beach on the east shore of the river,
    which is flowing quickly by. A path runs beside the river to the
    south here, and a passage is partially buried in sand to the
    northeast.
  exits:
    ne:
      to: sandy-cave
    south:
      to: shore
  tags:
  - dark
- id: sandy-cave
  name: Sandy Cave
  description: This is a sand-filled cave whose exit is to the southwest.
  exits:
    sw:
      to: sandy-beach
  tags:
  - dark
- id: aragain-falls
  name: Aragain Falls
  description:
    default: >-
      You are at the top of Aragain Falls, an enormous waterfall with
      a drop of about 450 feet. The only path here is on the north
      end. A beautiful rainbow can be seen over the falls and to the
      west.
    variants:
    - when:
        has_flag: rainbow_flag
      text: >-
        You are at the top of Aragain Falls, an enormous waterfall with
        a drop of about 450 feet. The only path here is on the north
        end. A solid rainbow spans the falls.
  exits:
    west:
      to: on-rainbow
      when:
        has_flag: rainbow_flag
    down:
      to: aragain-falls
      blocked: true
      msg: It's a long way..
    north:
      to: shore
    up:
      to: on-rainbow
      when:
        has_flag: rainbow_flag
- id: on-rainbow
  name: On the Rainbow
  description: >-
    You are on top of a rainbow (I bet you never thought you would
    walk on a rainbow), with a magnificent view of the Falls. The
    rainbow travels east-west here.
  exits:
    west:
      to: end-of-rainbow
    east:
      to: aragain-falls
- id: end-of-rainbow
  name: End of Rainbow
  description: >-
    You are on a small, rocky beach on the continuation of the
    Frigid River past the Falls. The beach is narrow due to the
    presence of the White Cliffs. The river canyon opens here and
    sunlight shines in from above. A rainbow crosses over the falls
    to the east and a narrow path continues to the southwest.
  exits:
    up:
      to: on-rainbow
      when:
        has_flag: rainbow_flag
    ne:
      to: on-rainbow
      when:
        has_flag: rainbow_flag
    east:
      to: on-rainbow
      when:
        has_flag: rainbow_flag
    sw:
      to: canyon-bottom
- id: canyon-bottom
  name: Canyon Bottom
  description: >-
    You are beneath the walls of the river canyon which may be
    climbable here. The lesser part of the runoff of Aragain Falls
    flows by below. To the north is a narrow path.
  exits:
    up:
      to: cliff-middle
    north:
      to: end-of-rainbow
- id: cliff-middle
  name: Rocky Ledge
  description: >-
    You are on a ledge about halfway up the wall of the river
    canyon. You can see from here that the main flow from Aragain
    Falls twists along a passage which it is impossible for you to
    enter. Below you is the canyon bottom. Above you is more cliff,
    which appears climbable.
  exits:
    up:
      to: canyon-view
    down:
      to: canyon-bottom
- id: canyon-view
  name: Canyon View
  description: >-
    You are at the top of the Great Canyon on its west wall. From
    here there is a marvelous view of the canyon and parts of the
    Frigid River upstream. Across the canyon, the walls of the White
    Cliffs join the mighty ramparts of the Flathead Mountains to the
    east. Following the Canyon upstream to the north, Aragain Falls
    may be seen, complete with rainbow. The mighty Frigid River
    flows out from a great dark cavern. To the west and south can be
    seen an immense forest, stretching for miles around. A path
    leads northwest. It is possible to climb down into the canyon
    from here.
  exits:
    east:
      to: cliff-middle
    down:
      to: cliff-middle
    nw:
      to: clearing
    west:
      to: forest-3
    south:
      to: canyon-view
      blocked: true
      msg: Storm-tossed trees block your way
- id: mine-entrance
  name: Mine Entrance
  description: >-
    You are standing at the entrance of what might have been a coal
    mine. The shaft enters the west wall, and there is another exit
    on the south end of the room.
  exits:
    south:
      to: slide-room
    down:
      to: squeeky-room
    west:
      to: squeeky-room
  tags:
  - dark
- id: squeeky-room
  name: Squeaky Room
  description: >-
    You are in a small room. Strange squeaky sounds may be heard
    coming from the passage at the north end. You may also escape to
    the east.
  exits:
    north:
      to: bat-room
    east:
      to: mine-entrance
  tags:
  - dark
- id: bat-room
  name: Bat Room
  description: >-
    You are in a small room which has doors only to the east and
    south.
  exits:
    south:
      to: squeeky-room
    east:
      to: shaft-room
  tags:
  - dark
- id: shaft-room
  name: Shaft Room
  description: >-
    This is a large room, in the middle of which is a small shaft
    descending through the floor into darkness below. To the west
    and the north are exits from this room. Constructed over the top
    of the shaft is a metal framework to which a heavy iron chain is
    attached.
  exits:
    down:
      to: shaft-room
      blocked: true
      msg: You wouldn't fit and would die if you could
    west:
      to: bat-room
    north:
      to: smelly-room
  tags:
  - dark
- id: smelly-room
  name: Smelly Room
  description: >-
    This is a small nondescript room. However, from the direction of
    a small descending staircase a foul odor can be detected. To the
    south is a narrow tunnel.
  exits:
    down:
      to: gas-room
    south:
      to: shaft-room
  tags:
  - dark
- id: gas-room
  name: Gas Room
  description: >-
    This is a small room which smells strongly of coal gas. There is
    a short climb up some stairs and a narrow tunnel leading east.
  exits:
    up:
      to: smelly-room
    east:
      to: mine-1
  tags:
  - dark
- id: ladder-top
  name: Ladder Top
  description: >-
    This is a very small room. In the corner is a rickety wooden
    ladder, leading downward. It might be safe to descend. There is
    also a staircase leading upward.
  exits:
    down:
      to: ladder-bottom
    up:
      to: mine-4
  tags:
  - dark
- id: ladder-bottom
  name: Ladder Bottom
  description: >-
    This is a rather wide room. On one side is the bottom of a
    narrow wooden ladder. To the west and the south are passages
    leaving the room.
  exits:
    south:
      to: dead-end-5
    west:
      to: timber-room
    up:
      to: ladder-top
  tags:
  - dark
- id: dead-end-5
  name: Dead End
  description: You have come to a dead end in the mine.
  exits:
    north:
      to: ladder-bottom
  tags:
  - dark
- id: timber-room
  name: Timber Room
  description: >-
    This is a long and narrow passage, which is cluttered with
    broken timbers. A wide passage comes from the east and turns at
    the west end of the room into a very narrow passageway. From the
    west comes a strong draft.
  exits:
    east:
      to: ladder-bottom
    west:
      to: lower-shaft
      when:
        compare_var:
          name: count.items.by.player
          op: lte
          value: 2
      msg: You cannot fit through this passage with that load.
  tags:
  - dark
- id: lower-shaft
  name: Drafty Room
  description: >-
    This is a small drafty room in which is the bottom of a long
    shaft. To the south is a passageway and to the east a very
    narrow passage. In the shaft can be seen a heavy iron chain.
  exits:
    south:
      to: machine-room
    up:
      to: timber-room
      when:
        compare_var:
          name: count.items.by.player
          op: lte
          value: 2
      msg: You cannot fit through this passage with that load.
    east:
      to: timber-room
      when:
        compare_var:
          name: count.items.by.player
          op: lte
          value: 2
      msg: You cannot fit through this passage with that load.
  tags:
  - dark
- id: machine-room
  name: Machine Room
  description:
    default: >-
      This is a large, cold room whose sole exit is to the north. In
      one corner there is a machine which is reminiscent of a clothes
      dryer. On its face is a switch which is labelled "START". The
      switch does not appear to be manipulable by any human hand
      (unless the fingers are about 1/16 by 1/4 inch). On the front of
      the machine is a large lid, which is closed.
    variants:
    - when:
        has_flag: machine-open
      text: >-
        This is a large, cold room whose sole exit is to the north. In
        one corner there is a machine which is reminiscent of a clothes
        dryer. On its face is a switch which is labelled "START". The
        switch does not appear to be manipulable by any human hand
        (unless the fingers are about 1/16 by 1/4 inch). On the front of
        the machine is a large lid, which is open.
  exits:
    north:
      to: lower-shaft
  tags:
  - dark
- id: mine-1
  name: Coal Mine
  description: This is a nondescript part of a coal mine.
  exits:
    north:
      to: gas-room
    east:
      to: mine-1
    ne:
      to: mine-2
  tags:
  - dark
- id: mine-2
  name: Coal Mine
  description: This is a nondescript part of a coal mine.
  exits:
    north:
      to: mine-2
    south:
      to: mine-1
    se:
      to: mine-3
  tags:
  - dark
- id: mine-3
  name: Coal Mine
  description: This is a nondescript part of a coal mine.
  exits:
    south:
      to: mine-3
    sw:
      to: mine-4
    east:
      to: mine-2
  tags:
  - dark
- id: mine-4
  name: Coal Mine
  description: This is a nondescript part of a coal mine.
  exits:
    north:
      to: mine-3
    west:
      to: mine-4
    down:
      to: ladder-top
  tags:
  - dark
- id: slide-room
  name: Slide Room
  description: >-
    This is a small chamber, which appears to have been part of a
    coal mine. On the south wall of the chamber the letters
    \"Granite Wall\" are etched in the rock. To the east is a long
    passage, and there is a steep metal slide twisting downward. To
    the north is a small opening.
  exits:
    east:
      to: cold-passage
    north:
      to: mine-entrance
    down:
      to: cellar
  tags:
  - dark
